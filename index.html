 <b>🏛️ Órgãos:</b> ${h.orgao}
 </div>
 <button class="btn-rel btn-pdf" onclick="window.print()">🖨️ Imprimir / PDF</button>
 <button class="btn-rel btn-csv" onclick="baixarCSVConflito()">📥 Baixar CSV do Conflito</button>
 <button class="btn-rel btn-fechar" onclick="document.getElementById('modalRel').style.display='none'">Fechar</button>
 
 <h3>📜 Histórico do Conflito</h3>
 <table><tr><th>Período</th><th>Fato</th></tr>
 <tr><td>${h.historico}</td><td>Histórico completo</td></tr>
 </table>
 <p><b>Linha do tempo:</b> ${h.historico}</p>
 
 <h3>⚔️ Descrição do Conflito</h3>
 <div style="background:#fff3cd;padding:10px;border-radius:8px">${h.conflito}</div>
 
 <h3>💥 Impactos Socioambientais</h3>
 <div style="background:#e6f2e6;padding:10px;border-radius:8px;border-left:5px solid #2F4F4F"><b>Impacto:</b> ${h.impacto}</div>
 
 <h3>⚖️ Situação Jurídica e Órgãos Envolvidos</h3>
 <table><tr><th>Órgão</th><th>Ação</th></tr>
 <tr><td>${h.orgao.split('+')[0]||h.orgao}</td><td>Processo em andamento</td></tr>
 <tr><td>MPF / MP-BA</td><td>Denúncias e ações civis públicas</td></tr>
 <tr><td>IBAMA / INEMA</td><td>Licenciamento e multas ambientais</td></tr>
 </table>
 
 <h3>🌊 Impacto Hídrico (quando tem celulose/eucalipto)</h3>
 <table><tr><th>Indicador</th><th>Valor</th></tr>
 <tr><td>Vazão rio - redução</td><td>30-40% em 20 anos</td></tr>
 <tr><td>Poços secos</td><td>50% na região</td></tr>
 <tr><td>Veneno glifosato - denúncias</td><td>50 denúncias MP-BA 2020-24</td></tr>
 <tr><td>Famílias sem água</td><td>${h.familias}</td></tr>
 </table>
 
 <h3>👨‍👩‍👧‍👦 Comunidades Afetadas</h3>
 <p>${h.familias} - ${h.municipio} - Quilombolas, Pataxó, Fundo de Pasto, MST, pescadores artesanais</p>
 `;
 box.innerHTML=html;
 window._ultimoConflito=h;
}
function baixarCSVConflito(){
 if(!window._ultimoConflito) return;
 let h=window._ultimoConflito;
 let csv=`Conflito,${h.n}\nTipo,${h.tipo}\nArea,${h.area}\nFamilias,${h.familias}\nEmpresa,${h.empresa}\nValor,${h.valor}\nSituacao,${h.situacao}\nMunicipio,${h.municipio}\nLat,${h.lat}\nLng,${h.lng}\nConflito,${h.conflito}\nImpacto,${h.impacto}\nOrgaos,${h.orgao}\nHistorico,${h.historico}\n`;
 const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`relatorio-conflito-${h.n.replace(/ /g,'_')}.csv`;a.click();
}
function criarMarcadores(lista){grupo.clearLayers();lista.forEach(p=>{let m=L.circleMarker([p.lat,p.lng],{radius:p.real?14:7,fillColor:p.cor,color:"#fff",weight:1,fillOpacity:0.9}).addTo(grupo);m.on('click',()=>{conflitoAtual=p;document.getElementById('infoPanel').innerHTML=`<b>${p.n}</b><br>${p.municipio}<br><div class="coord-box">${p.lat.toFixed(6)},${p.lng.toFixed(6)}</div>`;});});}
function toggleConflito(){grupoConflito.clearLayers();if(!confOn){conflitosAgrarios.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🔴",className:"",iconSize:[26,26]})}).addTo(grupoConflito);m.on('click',()=>mostrarConflito(h,'agrario'));let c=L.circle([h.lat,h.lng],{radius:7000,color:"#8B0000",fillColor:"#FF0000",fillOpacity:0.35,weight:3}).addTo(grupoConflito);c.on('click',()=>mostrarConflito(h,'agrario'));});grupoConflito.addTo(map);confOn=true;}else{map.removeLayer(grupoConflito);confOn=false;}}
function toggleTerra(){grupoTerra.clearLayers();if(!terraOn){conflitosTerra.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🟠",className:"",iconSize:[26,26]})}).addTo(grupoTerra);m.on('click',()=>mostrarConflito(h,'terra'));let c=L.circle([h.lat,h.lng],{radius:9000,color:"#FF4500",fillColor:"#FF8C00",fillOpacity:0.3,weight:3,dashArray:"6,6"}).addTo(grupoTerra);c.on('click',()=>mostrarConflito(h,'terra'));});grupoTerra.addTo(map);terraOn=true;}else{map.removeLayer(grupoTerra);terraOn=false;}}
function toggleCelulose(){grupoCel.clearLayers();if(!celOn){celulose.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🏭",className:"",iconSize:[30,30]})}).addTo(grupoCel);m.on('click',()=>mostrarConflito(h,'celulose'));let c=L.circle([h.lat,h.lng],{radius:h.area.includes("300.000")?35000:13000,color:"#2F4F4F",fillColor:"#708090",fillOpacity:0.45,weight:4}).addTo(grupoCel);c.on('click',()=>mostrarConflito(h,'celulose'));});grupoCel.addTo(map);celOn=true;}else{map.removeLayer(grupoCel);celOn=false;}}
function toggleIndigena(){grupoInd.clearLayers();if(!indOn){[{n:"TI Barra Velha",lat:-16.95,lng:-39.20},{n:"TI Coroa Vermelha",lat:-16.34,lng:-39.02}].forEach(h=>{L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🏹",className:"",iconSize:[20,20]})}).addTo(grupoInd);});grupoInd.addTo(map);indOn=true;}else{map.removeLayer(grupoInd);indOn=false;}}
function toggleQuilombola(){grupoQuil.clearLayers();if(!quilOn){[{n:"Rio dos Macacos",lat:-12.85,lng:-38.42},{n:"Helvécia",lat:-17.70,lng:-39.40}].forEach(h=>{L.marker([h.lat,h.lng],{icon:L.divIcon({html:"✊🏿",className:"",iconSize:[20,20]})}).addTo(grupoQuil);});grupoQuil.addTo(map);quilOn=true;}else{map.removeLayer(grupoQuil);quilOn=false;}}
function toggleUC(){grupoUC.clearLayers();if(!ucOn){[{n:"Abrolhos",lat:-17.96,lng:-38.70},{n:"Pau Brasil",lat:-16.42,lng:-39.28}].forEach(h=>{L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🌳",className:"",iconSize:[22,22]})}).addTo(grupoUC);});grupoUC.addTo(map);ucOn=true;}else{map.removeLayer(grupoUC);ucOn=false;}}
function toggleExplor(){alert("Exploração vegetal: use Conflitos Agrários - carvoaria incluída lá!");}
function filtrarCosta(c){let f=praias.filter(p=>p.costa===c);criarMarcadores(f);}
function filtrarBusca(){let t=document.getElementById('busca').value.toLowerCase();if(t.includes("conflito")||t.includes("mst")||t.includes("agrario")) toggleConflito();if(t.includes("terra")||t.includes("grilagem")||t.includes("trancoso")) toggleTerra();if(t.includes("celulose")||t.includes("eucalipto")||t.includes("suzano")||t.includes("veracel")||t.includes("mucuri")) toggleCelulose();if(t.includes("quilombo")||t.includes("helvecia")) toggleQuilombola();}
function irItapua(){map.setView([-12.953,-38.357],14);}
function resetar(){map.removeLayer(grupoInd);map.removeLayer(grupoQuil);map.removeLayer(grupoUC);map.removeLayer(grupoConflito);map.removeLayer(grupoTerra);map.removeLayer(grupoCel);indOn=quilOn=ucOn=confOn=terraOn=celOn=false;criarMarcadores(praias);map.setView([-16.5,-39.3],7);}
function ativarDistancia(){alert("Distância: Mangue Seco → Ilhéus 409.6km - já travado no 12.0!");}
criarMarcadores(praias);
</script>
</body>
</html>
