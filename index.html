function relogio(){
 const agora = new Date();
 document.getElementById('clock').innerText = agora.toLocaleTimeString('pt-BR');
}
setInterval(relogio,1000); relogio();
async function fetchTempo(lat,lng){
 try{
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,relative_humidity_2m&timezone=America%2FSao_Paulo`;
  const r = await fetch(url);
  const j = await r.json();
  return j.current;
 }catch(e){return null}
}
async function atualizaSalvador(){
 const cur = await fetchTempo(-13.010,-38.532);
 if(cur){
  document.getElementById('tempSalvador').innerHTML = `📍 Salvador ${cur.temperature_2m}°C | Vento ${cur.wind_speed_10m} km/h | ${new Date().toLocaleTimeString('pt-BR')}`;
 }
}
atualizaSalvador(); setInterval(atualizaSalvador, 3600000);
pontos.forEach(p=>{
 const m = L.marker([p.lat,p.lng]).addTo(map);
 m.bindPopup(`<b>${p.n}</b><br><span class=badge>${p.reg}</span><br><div id='pop-${p.lat}'>Clique para carregar clima AO VIVO...</div>`);
 m.on('click', async ()=>{
   const box = document.getElementById(`pop-${p.lat}`);
   if(box) box.innerHTML = '⏳ Buscando AO VIVO...';
