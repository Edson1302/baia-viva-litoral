let map=L.map('map').setView([-12.97,-38.51],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=[];
function criar(filtro){
markers.forEach(m=>map.removeLayer(m));markers=[];
document.getElementById('lista').innerHTML='';
let filtradas=filtro==='TODAS'?praias:praias.filter(p=>p.cat===filtro);
document.getElementById('filtroAtual').innerText=filtro+' ('+filtradas.length+')';
filtradas.forEach(p=>{
let oLat=(filtro==='RIBEIRA'||filtro==='ITAPARICA')?(Math.random()-0.5)*0.006:0;
let oLng=(filtro==='RIBEIRA'||filtro==='ITAPARICA')?(Math.random()-0.5)*0.006:0;
let mk=L.marker([p.lat+oLat,p.lng+oLng]).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.info}<br><a href='https://wa.me/5571992418354?text=Check-in ${p.name}' target='_blank'>Zap</a>`);
markers.push(mk);
let d=document.createElement('div');d.className='praia-item';d.innerHTML=`<b>${p.name}</b> - ${p.info}`;
d.onclick=()=>{map.setView([p.lat+oLat,p.lng+oLng],14);mk.openPopup();};
document.getElementById('lista').appendChild(d);
});
