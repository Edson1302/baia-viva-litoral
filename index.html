const map = L.map('map').setView([-13.2, -38.9], 7.5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18, attribution:'Baía Viva 7.0 - 137 praias'}).addTo(map);
const cluster = L.markerClusterGroup({spiderfyOnMaxZoom:true,showCoverageOnHover:false,maxClusterRadius:50,disableClusteringAtZoom:13});
let chart;

function criarMarcadores(lista){
  cluster.clearLayers();
  lista.forEach(p=>{
    let cor='#00a8cc';
    if(p.regiao.includes('CACAU')) cor='#4e342e';
    else if(p.regiao.includes('DENDÊ')) cor='#e65100';
    else if(p.regiao.includes('SALVADOR')) cor='#0a4a7a';
    else if(p.regiao.includes('BTS')) cor='#2e7d32';
    else if(p.regiao.includes('NORTE')) cor='#ff9800';
    else if(p.regiao.includes('RECÔNCAVO')) cor='#6a1b9a';
    let icon = L.divIcon({
      className:'',
      html:`<div style="background:${cor};width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid white;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,0.4)"><span style="transform:rotate(45deg);font-size:14px">📍</span></div>`,
      iconSize:[28,28],
      iconAnchor:[14,28]
    });
    let m = L.marker([p.lat,p.lng],{icon}).bindPopup(`
      <div style="min-width:230px">
      <b style="font-size:14px">${p.nome}</b><br>
      <small style="background:${cor};color:white;padding:2px 6px;border-radius:10px">${p.regiao} | ${p.temp} | ${p.balne}</small><br><br>
      <span class="badge badge-eco">🌿 ${p.vegetacao}</span><br>
      <span class="badge badge-foz">🌊 Foz: ${p.foz}</span><br>
      <span class="badge badge-pesca">🏝️ ${p.ecossistema}</span><br>
      <div style="margin-top:6px;font-size:12px;line-height:1.4">
      🎣 <b>Pesca:</b> ${p.pesca}<br>
      💰 <b>Economia:</b> ${p.economia}<br>
      🐟 <b>Espécies:</b> ${p.especies}<br>
      🌊 <b>Maré:</b> ${p.mare_corrente}<br>
      💨 <b>Massa ar:</b> ${p.massa_ar}
      </div></div>
    `);
    cluster.addLayer(m);
  });
  map.addLayer(cluster);
}

function atualizarPainel(lista){
  document.getElementById('info').innerHTML = `<h3>📍 ${lista.length} praias | ATLAS 7.0 COMPLETO 2338 LINHAS</h3><p>12 campos | Método Prof Edson | Ícones corrigidos</p>`;
  let html='';
  lista.slice(0,45).forEach(p=>{
    html+=`<div class="card-praia" style="border-left-color:${p.regiao.includes('CACAU')?'#4e342e':p.regiao.includes('DENDÊ')?'#e65100':'#00a8cc'}">
      <b>${p.nome}</b> <small>- ${p.regiao}</small><br>
      <small>🌿 ${p.vegetacao.substring(0,40)} | 🌊 ${p.foz.substring(0,30)}<br>
      🎣 ${p.pesca.substring(0,35)} | 🐟 ${p.especies.split(',')[0]}</small>
    </div>`;
  });
  document.getElementById('listaPraias').innerHTML = html + (lista.length>45?`<p style="text-align:center;padding:12px;background:#f0f0f0;border-radius:8px;margin-top:10px">+ ${lista.length-45} praias no mapa - clique nos clusters numerados!</p>`:'');
  let cont={}; lista.forEach(p=>cont[p.regiao]=(cont[p.regiao]||0)+1);
  if(chart) chart.destroy();
  chart = new Chart(document.getElementById('grafico'),{
    type:'doughnut',
    data:{
      labels:Object.keys(cont),
      datasets:[{data:Object.values(cont),backgroundColor:['#2e7d32','#0a4a7a','#ff9800','#6a1b9a','#4e342e','#e65100'],borderWidth:2,borderColor:'#fff'}]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{position:'bottom',labels:{font:{size:10},padding:12,boxWidth:12}},
        title:{display:true,text:'137 praias - Distribuição por Região',font:{size:13}}
      }
    }
  });
}

function filtrar(regiao){
  document.querySelectorAll('.botoes-regioes button').forEach(b=>b.classList.remove('active'));
  let btn=document.getElementById('btn-'+regiao);
  if(btn) btn.classList.add('active');
  let lista = regiao==='TODAS'?praias:praias.filter(p=>p.regiao===regiao);
  criarMarcadores(lista);
  atualizarPainel(lista);
  if(lista.length>0){
    let bounds=L.latLngBounds(lista.map(p=>[p.lat,p.lng]));
    map.fitBounds(bounds.pad(0.15));
  }
}

criarMarcadores(praias);
atualizarPainel(praias);
