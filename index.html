let markers=[];
function addMarkers(lista){
markers.forEach(m=>map.removeLayer(m));markers=[];

if(p.cond==='IMPROPRIA') cor='#e74c3c';

let defeso='<div style="background:#ffebee;color:#c62828;padding:4px 6px;border-radius:6px;font-size:.65rem;margin:4px 0">🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!</div>';

}
function filtrar(reg,btn){
document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
if(reg==='Todas')addMarkers(praias);else addMarkers(praias.filter(p=>p.regiao===reg));
}
function gps(){
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude; const lng=pos.coords.longitude;
L.marker([lat,lng]).addTo(map).bindPopup("Você está aqui! 📍").openPopup();
let perto=praias[0]; let menor=9999;
praias.forEach(p=>{let d=Math.hypot(p.lat-lat,p.lng-lng); if(d<menor){menor=d; perto=p;}});
map.setView([perto.lat,perto.lng],13);
alert("Praia mais perto: "+perto.name+" - "+perto.bal);
});
}else alert("GPS não suportado");
}
addMarkers(praias);
new Chart(document.getElementById('grafico'),{type:'bar',data:{labels:['BTS','Atlant','Itaparica','L Verde','Ilheus','Extremo','Mangue'],datasets:[{label:'% Boas',data:[62,83,92,93,86,92,100],backgroundColor:['#e74c3c','#00b4d8','#2ecc71','#f1c40f','#8e44ad','#e67e22','#2e7d32']}]},options:{plugins:{legend:{display:false}}}});
