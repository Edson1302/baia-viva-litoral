function haversine(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}

t-weight:bold':''}"><td>${d.time[i].split('-').reverse().join('/')}${i==10?' (HOJE)':''}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${nav}</td></tr>`;}html+=`</table><h3>🌿 Geografia + Humano</h3><p>Mangue Camamu 120km² | Territórios tradicionais próximos: Aldeias Pataxó, Quilombos, UCs</p>`;box.innerHTML=html;window._ultimoRelatorio=d;}catch(e){box.innerHTML+=`<p style="color:red">Erro.</p>`;}}
function baixarCSV(){if(!window._ultimoRelatorio) return;const d=window._ultimoRelatorio;let csv="Data,Max,Min,Vento,Chuva,Praia,Lat,Lng\n";for(let i=0;i<d.time.length;i++){csv+=`${d.time[i]},${d.temperature_2m_max[i]},${d.temperature_2m_min[i]},${d.wind_speed_10m_max[i]},${d.precipitation_sum[i]},${praiaAtual.n},${praiaAtual.lat},${praiaAtual.lng}\n`;}const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`relatorio-13.0-${praiaAtual.n}.csv`;a.click();}
async function mostrarInfo(p){praiaAtual=p;const panel=document.getElementById('infoPanel');panel.innerHTML=`<b>⏳ ${p.n}...</b>`;const tempo=await buscarTempoReal(p.lat,p.lng);let html=`<b>${p.n}</b> <span style="background:${p.cor};color:#fff;padding:2px 6px;border-radius:10px;font-size:9px">${p.costa}</span><br><b>${p.municipio}</b><br><small>${p.desc}</small><div class="coord-box">📍 ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div><div style="margin-top:6px">👥 ${p.visitantes} | 📅 ${p.alta}</div><div style="background:#f9ebea;padding:6px;border-radius:8px;margin-top:4px"><b>♻️ ${p.preserv}</b><br><small>${p.pontos||''}</small></div><div class="tempo-real">`;if(tempo.ok){const av=avalia(tempo.vento);html+=`<b>🌡️ ${tempo.temp}°C - ${tempo.cond}</b><br>💨 ${tempo.vento}km/h <span class="badge ${av.c}">${av.p}</span>`;}html+=`</div><button class="btn-rel" onclick="gerarRelatorio()">📊 RELATÓRIO TOTAL 13.0</button>`;panel.innerHTML=html;}
function mostrarHumano(h,tipo){const p=document.getElementById('infoPanel');let cor=tipo==="ind"?"#8B4513":tipo==="quil"?"#000":tipo==="fundo"?"#D2691E":"#006400";let emoji=tipo==="ind"?"🏹":tipo==="quil"?"✊🏿":tipo==="fundo"?"🌵":"🌳";p.innerHTML=`<b style="color:${cor}">${emoji} ${h.n}</b><br><div class="humano-box"><b>Tipo:</b> ${h.tipo||h.povo||h.tipo}<br>${h.povo?`<b>Povo:</b> ${h.povo}<br>`:''}${h.pop?`<b>Pop:</b> ${h.pop}<br>`:''}${h.pessoas?`<b>Famílias:</b> ${h.pessoas}<br>`:''}${h.familias?`<b>Famílias:</b> ${h.familias}<br>`:''}<b>Área:</b> ${h.area}<br><b>Situação:</b> ${h.situacao||h.ano}<br><b>Município:</b> ${h.municipio}<br><br><b>Descrição:</b> ${h.desc}<br>${h.orgao?`<b>Órgão:</b> ${h.orgao}<br>`:''}</div><div class="coord-box">📍 ${h.lat.toFixed(6)}, ${h.lng.toFixed(6)}</div><div class="tempo-real">Território tradicional protegido. Importância cultural e ambiental.</div>`;}
function criarMarcadores(lista){grupo.clearLayers();lista.forEach(p=>{let m=L.circleMarker([p.lat,p.lng],{radius:p.real?14:7,fillColor:p.cor,color:"#fff",weight:p.real?3:1,fillOpacity:0.9}).addTo(grupo);m.on('click',()=>mostrarInfo(p));});document.getElementById('contador').innerText=lista.length;}
function toggleMangue(){if(!mangueOn){L.circle([-13.95,-39.05],{radius:15000,color:"#1e8449",fillColor:"#27ae60",fillOpacity:0.35}).addTo(grupoMangue);grupoMangue.addTo(map);mangueOn=true;}else{map.removeLayer(grupoMangue);mangueOn=false;}}
function toggleVeg(){if(!vegOn){L.circle([-14.2,-39.0],{radius:20000,color:"#52be80",fillColor:"#82e0aa",fillOpacity:0.25,dashArray:"5,5"}).addTo(grupoVeg);grupoVeg.addTo(map);vegOn=true;}else{map.removeLayer(grupoVeg);vegOn=false;}}
function toggleEstuario(){if(!estuarioOn){L.circleMarker([-12.90,-38.80],{radius:8,fillColor:"#2e86c1",color:"#fff",weight:2}).addTo(grupoEstuario);grupoEstuario.addTo(map);estuarioOn=true;}else{map.removeLayer(grupoEstuario);estuarioOn=false;}}
function toggleTurismo(){if(!turOn){L.marker([-12.585,-38.001],{icon:L.divIcon({html:"🏖️",className:"",iconSize:[20,20]})}).addTo(grupoTur);grupoTur.addTo(map);turOn=true;}else{map.removeLayer(grupoTur);turOn=false;}}
function toggleIndigena(){grupoInd.clearLayers();if(!indOn){indigenas.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🏹",className:"",iconSize:[22,22]})}).addTo(grupoInd);m.on('click',()=>mostrarHumano(h,'ind'));let c=L.circle([h.lat,h.lng],{radius:5000,color:"#8B4513",fillColor:"#CD853F",fillOpacity:0.3,weight:2}).addTo(grupoInd);c.on('click',()=>mostrarHumano(h,'ind'));});grupoInd.addTo(map);indOn=true;}else{map.removeLayer(grupoInd);indOn=false;}}
function toggleQuilombola(){grupoQuil.clearLayers();if(!quilOn){quilombolas.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"✊🏿",className:"",iconSize:[22,22]})}).addTo(grupoQuil);m.on('click',()=>mostrarHumano(h,'quil'));let c=L.circle([h.lat,h.lng],{radius:3000,color:"#000",fillColor:"#FFD700",fillOpacity:0.3,weight:2}).addTo(grupoQuil);c.on('click',()=>mostrarHumano(h,'quil'));});grupoQuil.addTo(map);quilOn=true;}else{map.removeLayer(grupoQuil);quilOn=false;}}
function toggleFundo(){grupoFundo.clearLayers();if(!fundoOn){fundoPasto.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🌵",className:"",iconSize:[22,22]})}).addTo(grupoFundo);m.on('click',()=>mostrarHumano(h,'fundo'));let c=L.circle([h.lat,h.lng],{radius:4000,color:"#D2691E",fillColor:"#DEB887",fillOpacity:0.3,weight:2}).addTo(grupoFundo);c.on('click',()=>mostrarHumano(h,'fundo'));});grupoFundo.addTo(map);fundoOn=true;}else{map.removeLayer(grupoFundo);fundoOn=false;}}
function toggleUC(){grupoUC.clearLayers();if(!ucOn){ucs.forEach(h=>{let m=L.marker([h.lat,h.lng],{icon:L.divIcon({html:"🌳",className:"",iconSize:[24,24]})}).addTo(grupoUC);m.on('click',()=>mostrarHumano(h,'uc'));let c=L.circle([h.lat,h.lng],{radius:8000,color:"#006400",fillColor:"#228B22",fillOpacity:0.2,weight:2,dashArray:"5,5"}).addTo(grupoUC);c.on('click',()=>mostrarHumano(h,'uc'));});grupoUC.addTo(map);ucOn=true;}else{map.removeLayer(grupoUC);ucOn=false;}}
function ativarDistancia(){distAtiva=!distAtiva;pontosDist=[];if(distAtiva){alert("📏 Clique em 2 praias! Ex: Mangue Seco → Ilhéus 409.6km");} }
function filtrarCosta(c){let f=praias.filter(p=>p.costa===c);criarMarcadores(f);}
function filtrarBusca(){let t=document.getElementById('busca').value.toLowerCase();if(!t) return criarMarcadores(praias);let fp=praias.filter(p=>p.n.toLowerCase().includes(t));let fi=indigenas.filter(p=>p.n.toLowerCase().includes(t));let fq=quilombolas.filter(p=>p.n.toLowerCase().includes(t));let fu=ucs.filter(p=>p.n.toLowerCase().includes(t));if(fp.length) criarMarcadores(fp);if(fi.length){toggleIndigena();}if(fq.length){toggleQuilombola();}if(fu.length){toggleUC();}}
function irItapua(){let it=praias.find(p=>p.real);map.setView([it.lat,it.lng],14);mostrarInfo(it);}
function resetar(){map.removeLayer(grupoMangue);map.removeLayer(grupoVeg);map.removeLayer(grupoEstuario);map.removeLayer(grupoTur);map.removeLayer(grupoInd);map.removeLayer(grupoQuil);map.removeLayer(grupoFundo);map.removeLayer(grupoUC);mangueOn=vegOn=estuarioOn=turOn=indOn=quilOn=fundoOn=ucOn=false;criarMarcadores(praias);map.setView([-14.5,-39.0],7);}
criarMarcadores(praias);
</script>
