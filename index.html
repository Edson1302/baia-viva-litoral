let map=L.map('map').setView([-12.97,-38.51],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=[];
function criar(filtro){
markers.forEach(m=>map.removeLayer(m));markers=[];
document.getElementById('lista').innerHTML='';
let filtradas=filtro==='TODAS'?praias:praias.filter(p=>p.cat===filtro);
filtradas.forEach(p=>{
let oLat=(filtro==='RIBEIRA'||filtro==='ITAPARICA')?(Math.random()-0.5)*0.006:0;
let oLng=(filtro==='RIBEIRA'||filtro==='ITAPARICA')?(Math.random()-0.5)*0.006:0;
let mk=L.marker([p.lat+oLat,p.lng+oLng]).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.info}<br><a href='https://wa.me/5571992418354?text=${p.name}'>Zap</a>`);
markers.push(mk);
let d=document.createElement('div');d.className='praia-item';d.innerHTML=`<b>${p.name}</b><br>${p.info}`;d.onclick=()=>{map.setView([p.lat+oLat,p.lng+oLng],13);mk.openPopup();};
document.getElementById('lista').appendChild(d);
});
if(markers.length){map.fitBounds(new L.featureGroup(markers).getBounds().pad(0.2));}
}
function filtrar(cat,btn){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');criar(cat);}
