<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7}
.header{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:1000;background:#0a3d62;color:#fff;padding:8px 14px;border-radius:30px;font-weight:bold;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.5);font-size:10px}

.btn-coqueiros{background:#e67e22}.btn-todos{background:#2980b9}.btn-dende{background:#27ae60}.btn-cacau{background:#8e44ad}.btn-descob{background:#c0392b}.btn-baleias{background:#f1c40f;color:#000!important}.btn-real{background:red}.btn-reset{background:#34495e}
.btn-mangue{background:#1e8449}.btn-veg{background:#52be80;color:#000!important}.btn-estuario{background:#2e86c1}.btn-turismo{background:#d35400}.btn-dist{background:#000}.btn-sazonal{background:#8e44ad}

.relatorio-box table{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}.relatorio-box th,.relatorio-box td{border:1px solid #ccc;padding:4px;text-align:center}.relatorio-box th{background:#0a3d62;color:#fff}

<hr>
<b style="font-size:9px;color:#000">📏 NOVA CALCULADORA - ESCOLHA 2 PRAIAS</b>
<select id="praia1"></select>
<select id="praia2"></select>

<script>
const praias=[
{n:"Mangue Seco",lat:-11.44,lng:-37.34,costa:"Coqueiros",cor:"#e67e22",municipio:"Jandaíra",tipo:"Oceânica dunas",ext:"5km",desc:"Dunas Tieta",visitantes:"30k/ano",alta:"Dez-Mar",preserv:"Mar-Mai desova tartaruga"},
{n:"Sítio do Conde",lat:-11.92,lng:-37.60,costa:"Coqueiros",cor:"#e67e22",municipio:"Conde",tipo:"Vila",ext:"3km",desc:"Pescadores",visitantes:"20k/ano",alta:"Dez-Fev",preserv:"Tartaruga Set-Mar"},
{n:"Praia do Forte",lat:-12.585,lng:-38.001,costa:"Coqueiros",cor:"#e67e22",municipio:"Mata S. João",tipo:"Recifes",ext:"4km",desc:"Tamar",visitantes:"800k/ano",alta:"Dez-Mar/Jul",preserv:"Desova tartaruga Set-Mar",pontos:"Projeto Tamar"},
{n:"Arembepe",lat:-12.75,lng:-38.16,costa:"Coqueiros",cor:"#e67e22",municipio:"Camaçari",tipo:"Histórica",ext:"3km",desc:"Hippie",visitantes:"100k/ano",alta:"Dez-Fev",preserv:"Aldeia Hippie"},
{n:"Stella Maris",lat:-12.934,lng:-38.33,costa:"Todos os Santos",cor:"#2980b9",municipio:"Salvador",tipo:"Oceânica",ext:"2km",desc:"Ondas",visitantes:"500k/ano",alta:"Ano todo",preserv:"Dunas"},
{n:"ITAPUÃ REAL",lat:-12.953,lng:-38.357,costa:"Todos os Santos",cor:"red",municipio:"Salvador PONTO REAL",tipo:"Farol",ext:"2km",desc:"PONTO REAL PROF EDSON",real:true,visitantes:"2M/ano",alta:"Dez-Mar",preserv:"Farol histórico",pontos:"Farol Itapuã, Lagoa Abaeté"},
{n:"Farol da Barra",lat:-13.010,lng:-38.533,costa:"Todos os Santos",cor:"#2980b9",municipio:"Salvador",tipo:"Cartão",ext:"0.5km",desc:"Encontro baía oceano",visitantes:"3M/ano",alta:"Ano todo",preserv:"Patrimônio",pontos:"Farol da Barra"},
{n:"Mar Grande",lat:-12.89,lng:-38.67,costa:"Todos os Santos",cor:"#2980b9",municipio:"Vera Cruz",tipo:"Baía",ext:"5km",desc:"Itaparica",visitantes:"400k/ano",alta:"Dez-Mar",preserv:"Manguezal BTS"},
{n:"Guaibim",lat:-13.30,lng:-38.88,costa:"Dendê",cor:"#27ae60",municipio:"Valença",tipo:"Oceânica",ext:"10km",desc:"Valença",visitantes:"200k/ano",alta:"Dez-Mar",preserv:"Manguezal"},
{n:"Morro de São Paulo",lat:-13.376,lng:-38.915,costa:"Dendê",cor:"#27ae60",municipio:"Cairu",tipo:"Turística",ext:"4 praias",desc:"1a a 4a",visitantes:"600k/ano",alta:"Dez-Mar/Jul",preserv:"APA Tinharé-Boipeba",pontos:"Tirolesa, Fortaleza"},
{n:"Boipeba",lat:-13.61,lng:-38.92,costa:"Dendê",cor:"#27ae60",municipio:"Cairu",tipo:"Paradisíaca",ext:"5km",desc:"Rio Inferno",visitantes:"200k/ano",alta:"Dez-Mar",preserv:"APA preservadíssima",pontos:"Castelhanos"},
{n:"Barra Grande",lat:-13.89,lng:-38.94,costa:"Dendê",cor:"#27ae60",municipio:"Maraú",tipo:"Baía+Oceânica",ext:"6km",desc:"Ponta Mutá",visitantes:"300k/ano",alta:"Dez-Fev",preserv:"Defeso camarão Dez-Mai",pontos:"Ponta do Mutá"},
{n:"Taipu de Fora",lat:-13.92,lng:-38.92,costa:"Dendê",cor:"#27ae60",municipio:"Maraú",tipo:"Piscinas",ext:"2km",desc:"Melhores piscinas BA",visitantes:"250k/ano",alta:"Dez-Mar",preserv:"Recifes - não pisar coral",pontos:"Piscinas naturais"},
{n:"Itacaré Prainha",lat:-14.27,lng:-38.99,costa:"Cacau",cor:"#8e44ad",municipio:"Itacaré",tipo:"Trilha",ext:"0.5km",desc:"Paraíso",visitantes:"500k/ano",alta:"Dez-Mar/Jul",preserv:"Mata Atlântica",pontos:"Surfe"},
{n:"Trancoso",lat:-16.590,lng:-39.097,costa:"Descobrimento",cor:"#c0392b",municipio:"P. Seguro",tipo:"Charmosa",ext:"6km",desc:"Quadrado",visitantes:"800k/ano",alta:"Dez-Mar",preserv:"Quadrado histórico",pontos:"Quadrado, Espelho"},
{n:"Caraíva",lat:-16.789,lng:-39.144,costa:"Descobrimento",cor:"#c0392b",municipio:"P. Seguro",tipo:"Rústica",ext:"5km",desc:"Sem carro",visitantes:"300k/ano",alta:"Dez-Fev",preserv:"Sem carro, sem ponte",pontos:"Rio Caraíva"},
{n:"Abrolhos Siriba",lat:-17.96,lng:-38.70,costa:"Baleias",cor:"#f1c40f",municipio:"Parque Marinho",tipo:"Arquipélago",ext:"Parque",desc:"Berçário baleias",visitantes:"30k/ano ICMBio",alta:"Jul-Nov BALEIAS",preserv:"JUL-NOV limite 600/dia",pontos:"Baleia Jubarte"}
];
const manguezais=[{n:"Mangue BTS",lat:-12.85,lng:-38.62},{n:"Mangue Camamu 120km²",lat:-13.95,lng:-39.05},{n:"Mangue Caravelas 150km²",lat:-17.71,lng:-39.26}];
const turisticos=[{n:"Pelourinho",lat:-12.971,lng:-38.512,vis:"2.5M/ano"},{n:"Tamar Praia do Forte",lat:-12.585,lng:-38.001,vis:"500k/ano"},{n:"Ponta Mutá",lat:-13.89,lng:-38.94,vis:"250k/ano"},{n:"Abrolhos",lat:-17.96,lng:-38.70,vis:"30k controlado"}];
const sazonal=[{m:"Jan",tur:"ALTÍSSIMA",preserv:"Tartaruga desova"},{m:"Fev",tur:"ALTÍSSIMA Carnaval",preserv:"Lixo zero"},{m:"Jul",tur:"ALTA",preserv:"Baleias Jubarte - 100m"},{m:"Set",tur:"MÉDIA",preserv:"Tartaruga + Baleias"},{m:"Dez",tur:"ALTÍSSIMA",preserv:"Alta temporada"}];
let map=L.map('map').setView([-14.5,-39.0],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM 12.1'}).addTo(map);
let grupo=L.layerGroup().addTo(map), grupoMangue=L.layerGroup(), grupoVeg=L.layerGroup(), grupoEstuario=L.layerGroup(), grupoTur=L.layerGroup();
let praiaAtual=null, mangueOn=false, vegOn=false, estuarioOn=false, turOn=false;
function haversine(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}
async function buscarTempoReal(lat,lng){try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,weather_code&timezone=America/Bahia`;const r=await fetch(url);const j=await r.json();const c=j.current;let cond=c.weather_code<=1?"Céu limpo ☀️":c.weather_code<=3?"Parcial ⛅":c.weather_code<=67?"Chuva 🌧️":"Instável ⛈️";return {temp:c.temperature_2m,vento:c.wind_speed_10m,cond:cond,ok:true};}catch(e){return {ok:false};}
}
function avalia(v){return v<15?{p:"BOA",c:"badge-ok"}:v<25?{p:"MÉDIA",c:"badge-atencao"}:{p:"RUIM",c:"badge-ruim"};}
async function gerarRelatorio(){if(!praiaAtual) return;const box=document.getElementById('relBox');document.getElementById('modalRel').style.display='block';box.innerHTML=`<h2>📊 Relatório TOTAL - ${praiaAtual.n}</h2><p>Buscando 10+10 dias...</p>`;try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${praiaAtual.lat}&longitude=${praiaAtual.lng}&past_days=10&forecast_days=10&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_sum&timezone=America/Bahia`;const r=await fetch(url);const j=await r.json();const d=j.daily;let html=`<h2>📊 Relatório TOTAL - ${praiaAtual.n}</h2><p><b>${praiaAtual.municipio}</b> | <span style="font-family:monospace;background:#000;color:#0f0;padding:2px 6px">${praiaAtual.lat.toFixed(6)}, ${praiaAtual.lng.toFixed(6)}</span></p><div style="background:#fff3cd;padding:8px;border-radius:8px"><b>👥 ${praiaAtual.visitantes}</b> | <b>Alta:</b> ${praiaAtual.alta}<br><b>♻️ ${praiaAtual.preserv}</b></div><button class="btn-rel btn-pdf" onclick="window.print()">🖨️ PDF</button><button class="btn-rel btn-csv" onclick="baixarCSV()">📥 CSV</button><button class="btn-rel btn-reset" onclick="document.getElementById('modalRel').style.display='none'">Fechar</button><h3>Últimos 10 dias</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Pesca</th></tr>`;for(let i=0;i<10;i++){const pes=d.wind_speed_10m_max[i]<15?"BOA":d.wind_speed_10m_max[i]<25?"MÉDIA":"RUIM";html+=`<tr><td>${d.time[i].split('-').reverse().join('/')}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${pes}</td></tr>`;}html+=`</table><h3>Próximos 10 dias</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Nav</th></tr>`;for(let i=10;i<d.time.length;i++){const nav=d.wind_speed_10m_max[i]<15?"FAVORÁVEL":d.wind_speed_10m_max[i]<25?"ATENÇÃO":"DESFAVORÁVEL";html+=`<tr style="${i==10?'background:#e8f6ff;font-weight:bold':''}"><td>${d.time[i].split('-').reverse().join('/')}${i==10?' (HOJE)':''}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${nav}</td></tr>`;}html+=`</table><h3>🌿 Geografia</h3><p>Mangue: Baía Camamu 120km² | Vegetação: Mata/Restinga | Estuário: Rio próximo</p><h3>📅 Sazonalidade</h3><table><tr><th>Mês</th><th>Turismo</th><th>Preservação</th></tr>`;sazonal.forEach(s=>{html+=`<tr><td>${s.m}</td><td>${s.tur}</td><td>${s.preserv}</td></tr>`;});html+=`</table>`;box.innerHTML=html;window._ultimoRelatorio=d;}catch(e){box.innerHTML+=`<p style="color:red">Erro.</p>`;}}
function baixarCSV(){if(!window._ultimoRelatorio) return;const d=window._ultimoRelatorio;let csv="Data,Max,Min,Vento,Chuva,Praia,Lat,Lng\n";for(let i=0;i<d.time.length;i++){csv+=`${d.time[i]},${d.temperature_2m_max[i]},${d.temperature_2m_min[i]},${d.wind_speed_10m_max[i]},${d.precipitation_sum[i]},${praiaAtual.n},${praiaAtual.lat},${praiaAtual.lng}\n`;}const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`relatorio-${praiaAtual.n}.csv`;a.click();}
async function mostrarInfo(p){praiaAtual=p;const panel=document.getElementById('infoPanel');panel.innerHTML=`<b>⏳ ${p.n}...</b>`;const tempo=await buscarTempoReal(p.lat,p.lng);let html=`<b>${p.n}</b> <span style="background:${p.cor};color:#fff;padding:2px 6px;border-radius:10px;font-size:9px">${p.costa}</span><br><b>${p.municipio}</b><br><small>${p.desc}</small><div class="coord-box">📍 ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div><div style="margin-top:6px">👥 ${p.visitantes} | 📅 ${p.alta}</div><div class="sazonal-box"><b>♻️ ${p.preserv}</b><br><small>${p.pontos||''}</small></div><div class="tempo-real">`;if(tempo.ok){const av=avalia(tempo.vento);html+=`<b>🌡️ ${tempo.temp}°C - ${tempo.cond}</b><br>💨 ${tempo.vento}km/h <span class="badge ${av.c}">${av.p}</span>`;}html+=`</div><button class="btn-rel" onclick="gerarRelatorio()">📊 RELATÓRIO TOTAL</button>`;panel.innerHTML=html;}
function criarMarcadores(lista){grupo.clearLayers();lista.forEach(p=>{let m=L.circleMarker([p.lat,p.lng],{radius:p.real?14:7,fillColor:p.cor,color:"#fff",weight:p.real?3:1,fillOpacity:0.9}).addTo(grupo);m.on('click',()=>mostrarInfo(p));});document.getElementById('contador').innerText=lista.length;}
function toggleMangue(){if(!mangueOn){manguezais.forEach(m=>{L.circle([m.lat,m.lng],{radius:15000,color:"#1e8449",fillColor:"#27ae60",fillOpacity:0.35}).addTo(grupoMangue);});grupoMangue.addTo(map);mangueOn=true;}else{map.removeLayer(grupoMangue);mangueOn=false;}}
function toggleVeg(){if(!vegOn){L.circle([-14.2,-39.0],{radius:20000,color:"#52be80",fillColor:"#82e0aa",fillOpacity:0.25,dashArray:"5,5"}).addTo(grupoVeg);grupoVeg.addTo(map);vegOn=true;}else{map.removeLayer(grupoVeg);vegOn=false;}}
function toggleEstuario(){if(!estuarioOn){L.circleMarker([-12.90,-38.80],{radius:8,fillColor:"#2e86c1",color:"#fff",weight:2}).addTo(grupoEstuario);grupoEstuario.addTo(map);estuarioOn=true;}else{map.removeLayer(grupoEstuario);estuarioOn=false;}}
function toggleTurismo(){if(!turOn){turisticos.forEach(t=>{L.marker([t.lat,t.lng],{icon:L.divIcon({html:"🏖️",className:"",iconSize:[20,20]})}).addTo(grupoTur).bindPopup(`<b>${t.n}</b><br>👥 ${t.vis}`);});grupoTur.addTo(map);turOn=true;}else{map.removeLayer(grupoTur);turOn=false;}}
function mostrarSazonal(){let html=`<b>📅 Sazonalidade</b><br><table style="width:100%;font-size:9px;border-collapse:collapse"><tr><th>Mês</th><th>Turismo</th><th>Preservação</th></tr>`;sazonal.forEach(s=>{html+=`<tr><td>${s.m}</td><td>${s.tur}</td><td style="color:red">${s.preserv}</td></tr>`;});html+=`</table>`;document.getElementById('infoPanel').innerHTML=html;}
function filtrarCosta(c){let f=praias.filter(p=>p.costa===c);criarMarcadores(f);if(f.length) map.setView([f.reduce((a,b)=>a+b.lat,0)/f.length,f.reduce((a,b)=>a+b.lng,0)/f.length],9);}
function filtrarBusca(){let t=document.getElementById('busca').value.toLowerCase();if(!t) return criarMarcadores(praias);let fp=praias.filter(p=>p.n.toLowerCase().includes(t)||p.municipio.toLowerCase().includes(t));criarMarcadores(fp);}
function irItapua(){let it=praias.find(p=>p.real);map.setView([it.lat,it.lng],14);mostrarInfo(it);}
function resetar(){map.removeLayer(grupoMangue);map.removeLayer(grupoVeg);map.removeLayer(grupoEstuario);map.removeLayer(grupoTur);mangueOn=vegOn=estuarioOn=turOn=false;document.getElementById('busca').value="";criarMarcadores(praias);map.setView([-14.5,-39.0],7);}
// CALCULADORA NOVA 12.1
function popularSelects(){let s1=document.getElementById('praia1'),s2=document.getElementById('praia2');praias.forEach(p=>{let o1=document.createElement('option');o1.value=p.n;o1.text=`${p.n} (${p.costa})`;s1.appendChild(o1);let o2=document.createElement('option');o2.value=p.n;o2.text=`${p.n} (${p.costa})`;s2.appendChild(o2);});s1.selectedIndex=5; s2.selectedIndex=9;}
function calcularDistanciaSelect(){let n1=document.getElementById('praia1').value,n2=document.getElementById('praia2').value;let p1=praias.find(p=>p.n===n1),p2=praias.find(p=>p.n===n2);if(!p1||!p2) return;let d=haversine(p1.lat,p1.lng,p2.lat,p2.lng);let rumo=Math.atan2(p2.lng-p1.lng,p2.lat-p1.lat)*180/Math.PI;let dir=rumo>0&&rumo<90?"NE":rumo>90?"SE":rumo<0&&rumo>-90?"NO":"SO";document.getElementById('distInfo').innerHTML=`${p1.n} → ${p2.n}<br><b style="font-size:13px">${d.toFixed(1)} km</b><br>${(d/80).toFixed(1)}h carro | ${(d/22).toFixed(1)}h barco<br>Rumo ${rumo.toFixed(0)}° ${dir}`;map.fitBounds([[p1.lat,p1.lng],[p2.lat,p2.lng]]);L.polyline([[p1.lat,p1.lng],[p2.lat,p2.lng]],{color:'red',weight:3,dashArray:'10,10'}).addTo(grupo);document.getElementById('infoPanel').innerHTML=`<b>📏 ${p1.n} → ${p2.n}</b><br><div class="coord-box">${p1.n}: ${p1.lat.toFixed(6)}, ${p1.lng.toFixed(6)}<br>${p2.n}: ${p2.lat.toFixed(6)}, ${p2.lng.toFixed(6)}</div><div style="background:#000;color:#0f0;padding:10px;border-radius:10px;text-align:center;margin-top:6px"><b style="font-size:18px">${d.toFixed(1)} km</b><br>Carro: ${(d/80).toFixed(1)}h (80km/h)<br>Barco: ${(d/22).toFixed(1)}h (22km/h)<br>Lancha: ${(d/40).toFixed(1)}h (40km/h)<br><br>Rumo: ${rumo.toFixed(0)}° ${dir}</div>`;}
criarMarcadores(praias);
popularSelects();
</script>
