<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7}
.header{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:1000;background:#0a3d62;color:#fff;padding:12px 20px;border-radius:30px;font-weight:bold;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.5);font-size:12px}
.controls{position:absolute;top:65px;left:8px;z-index:1000;background:#fff;padding:10px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.3);width:250px;max-height:70vh;overflow:auto}
.controls input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px}
.controls button{width:100%;padding:7px;margin:2px 0;border:0;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff;font-size:11px}
.btn-coqueiros{background:#e67e22}.btn-todos{background:#2980b9}.btn-dende{background:#27ae60}.btn-cacau{background:#8e44ad}.btn-descob{background:#c0392b}.btn-baleias{background:#f1c40f;color:#000!important}.btn-real{background:red}.btn-reset{background:#34495e}
#map{height:100vh;width:100%}
.info-panel{position:absolute;bottom:15px;right:8px;z-index:1000;background:#fff;padding:12px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.4);width:330px;font-size:12px;max-height:60vh;overflow:auto;border-left:5px solid #0a3d62}
.tempo-real{background:#e8f6ff;border:1px solid #2980b9;border-radius:10px;padding:8px;margin-top:8px}
.badge{padding:2px 6px;border-radius:6px;font-size:10px;font-weight:bold}.badge-ok{background:#27ae60;color:#fff}.badge-atencao{background:#f1c40f}.badge-ruim{background:#c0392b;color:#fff}
.relatorio-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:2000;display:none;overflow:auto}
.relatorio-box{background:#fff;margin:20px auto;padding:20px;border-radius:12px;max-width:800px}
.relatorio-box table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}.relatorio-box th,.relatorio-box td{border:1px solid #ccc;padding:5px;text-align:center}.relatorio-box th{background:#0a3d62;color:#fff}
.btn-rel{width:100%;background:#0a3d62;color:#fff;padding:10px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-pdf{background:#27ae60}.btn-csv{background:#2980b9}
</style>
</head>
<body>
<div class="header">BAÍA VIVA 10.0 FINAL | RELATÓRIOS 10 DIAS PASSADO + 10 DIAS FUTURO | ITAPUÃ REAL -12.953,-38.357</div>
<div class="controls">
<input id="busca" placeholder="Buscar praia..." onkeyup="filtrarBusca()">
<button class="btn-coqueiros" onclick="filtrarCosta('Coqueiros')">Costa dos Coqueiros</button>
<button class="btn-todos" onclick="filtrarCosta('Todos os Santos')">Todos os Santos</button>
<button class="btn-dende" onclick="filtrarCosta('Dendê')">Dendê</button>
<button class="btn-cacau" onclick="filtrarCosta('Cacau')">Cacau</button>
<button class="btn-descob" onclick="filtrarCosta('Descobrimento')">Descobrimento</button>
<button class="btn-baleias" onclick="filtrarCosta('Baleias')">Baleias / Abrolhos</button>
<button class="btn-real" onclick="irItapua()">★ ITAPUÃ REAL</button>
<button class="btn-reset" onclick="resetar()">Mostrar Todas</button>
<div style="font-size:10px;margin-top:6px">Visíveis: <span id="contador">0</span></div>
</div>
<div id="map"></div>
<div class="info-panel" id="infoPanel"><b>Clique em uma praia</b><br>Vai aparecer tempo real + botão de relatório.</div>

<div class="relatorio-modal" id="modalRel"><div class="relatorio-box" id="relBox"></div></div>

<script>
const praias=[

{n:"Praia do Forte",lat:-12.585,lng:-38.001,costa:"Coqueiros",cor:"#e67e22",municipio:"Mata S. João",tipo:"Recifes",ext:"4km",desc:"Tamar"},
{n:"Guarajuba",lat:-12.65,lng:-38.09,costa:"Coqueiros",cor:"#e67e22",municipio:"Camaçari",tipo:"Piscinas",ext:"3km",desc:"Piscinas"},
{n:"Arembepe",lat:-12.75,lng:-38.16,costa:"Coqueiros",cor:"#e67e22",municipio:"Camaçari",tipo:"Histórica",ext:"3km",desc:"Hippie"},
{n:"Busca Vida",lat:-12.86,lng:-38.25,costa:"Coqueiros",cor:"#e67e22",municipio:"Camaçari",tipo:"Oceânica",ext:"4km",desc:"Condomínios"},
{n:"Stella Maris",lat:-12.934,lng:-38.330,costa:"Todos os Santos",cor:"#2980b9",municipio:"Salvador",tipo:"Oceânica",ext:"2km",desc:"Ondas fortes"},
{n:"Flamengo",lat:-12.917,lng:-38.320,costa:"Todos os Santos",cor:"#2980b9",municipio:"Salvador",tipo:"Oceânica",ext:"1.5km",desc:"Aeroporto"},
{n:"ITAPUÃ REAL",lat:-12.953,lng:-38.357,costa:"Todos os Santos",cor:"red",municipio:"Salvador PONTO REAL",tipo:"Farol referência",ext:"2km",desc:"PONTO REAL PROF EDSON",real:true},
{n:"Piatã",lat:-12.957,lng:-38.393,costa:"Todos os Santos",cor:"#2980b9",municipio:"Salvador",tipo:"Urbana",ext:"2.5km",desc:"Agitado"},

{n:"Porto da Barra",lat:-13.00,lng:-38.53,costa:"Todos os Santos",cor:"#2980b9",municipio:"Salvador",tipo:"Baía calma",ext:"0.4km",desc:"Calma"},

{n:"Guaibim",lat:-13.30,lng:-38.88,costa:"Dendê",cor:"#27ae60",municipio:"Valença",tipo:"Oceânica",ext:"10km",desc:"Valença"},

{n:"Boipeba",lat:-13.61,lng:-38.92,costa:"Dendê",cor:"#27ae60",municipio:"Cairu",tipo:"Paradisíaca",ext:"5km",desc:"Rio Inferno"},

{n:"Taipu de Fora",lat:-13.92,lng:-38.92,costa:"Dendê",cor:"#27ae60",municipio:"Maraú",tipo:"Piscinas",ext:"2km",desc:"Melhores piscinas"},
{n:"Itacaré Prainha",lat:-14.27,lng:-38.99,costa:"Cacau",cor:"#8e44ad",municipio:"Itacaré",tipo:"Trilha",ext:"0.5km",desc:"Trilha paraíso"},
{n:"Jeribucaçu",lat:-14.22,lng:-38.98,costa:"Cacau",cor:"#8e44ad",municipio:"Itacaré",tipo:"Selvagem",ext:"1km",desc:"Rio coqueiros"},
{n:"Ilhéus São Miguel",lat:-14.74,lng:-39.02,costa:"Cacau",cor:"#8e44ad",municipio:"Ilhéus",tipo:"Oceânica",ext:"4km",desc:"Aeroporto"},
{n:"Canavieiras",lat:-15.67,lng:-38.95,costa:"Cacau",cor:"#8e44ad",municipio:"Canavieiras",tipo:"Ilha",ext:"8km",desc:"Atalaia"},
{n:"Cabralia",lat:-16.27,lng:-39.02,costa:"Descobrimento",cor:"#c0392b",municipio:"Cabralia",tipo:"Histórica",ext:"4km",desc:"1a missa"},
{n:"Taperapuã",lat:-16.40,lng:-39.05,costa:"Descobrimento",cor:"#c0392b",municipio:"P. Seguro",tipo:"Badalada",ext:"5km",desc:"Barracas"},
{n:"Trancoso",lat:-16.590,lng:-39.097,costa:"Descobrimento",cor:"#c0392b",municipio:"P. Seguro",tipo:"Charmosa",ext:"6km",desc:"Quadrado"},
{n:"Caraíva",lat:-16.789,lng:-39.144,costa:"Descobrimento",cor:"#c0392b",municipio:"P. Seguro",tipo:"Rústica",ext:"5km",desc:"Sem carro"},
{n:"Corumbau",lat:-17.00,lng:-39.18,costa:"Descobrimento",cor:"#c0392b",municipio:"Prado",tipo:"Selvagem",ext:"10km",desc:"Ponta"},
{n:"Cumuruxatiba",lat:-17.105,lng:-39.225,costa:"Baleias",cor:"#f1c40f",municipio:"Prado",tipo:"Tranquila",ext:"6km",desc:"Pescadores"},
{n:"Prado Centro",lat:-17.338,lng:-39.221,costa:"Baleias",cor:"#f1c40f",municipio:"Prado",tipo:"Oceânica",ext:"4km",desc:"Centro Baleias"},
{n:"Caravelas",lat:-17.718,lng:-39.262,costa:"Baleias",cor:"#f1c40f",municipio:"Caravelas",tipo:"Estuário",ext:"8km",desc:"Porto Abrolhos"},
{n:"Abrolhos Siriba",lat:-17.96,lng:-38.70,costa:"Baleias",cor:"#f1c40f",municipio:"Parque Marinho",tipo:"Arquipélago",ext:"Parque",desc:"Berçário baleias"}
];
let map=L.map('map').setView([-14.5,-39.0],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OSM | Baía Viva 10.0'}).addTo(map);
let grupo=L.layerGroup().addTo(map);
let praiaAtual=null;

async function buscarTempoReal(lat,lng){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,wind_direction_10m,weather_code,relative_humidity_2m&timezone=America/Bahia`;
    const r=await fetch(url); const j=await r.json(); const c=j.current;
    let cond=c.weather_code<=1?"Céu limpo ☀️":c.weather_code<=3?"Parcial ⛅":c.weather_code<=67?"Chuva 🌧️":"Instável ⛈️";
    return {temp:c.temperature_2m,vento:c.wind_speed_10m,dir:c.wind_direction_10m,umid:c.relative_humidity_2m,cond:cond,ok:true};
  }catch(e){return {ok:false};}
}
function calculaMare(){
  const h=new Date().getHours()+new Date().getMinutes()/60;
  const altura=(1.2+0.8*Math.sin((h/12.4)*2*Math.PI)).toFixed(1);
  const fase=h%12.4; let estado=fase<3?"Enchendo ⬆️":fase<6?"Cheia 🌊":fase<9?"Vazando ⬇️":"Baixa 🏜️";
  return {altura,estado,proxima:fase<6?"Cheia em "+(6-fase).toFixed(1)+"h":"Baixa em "+(12.4-fase).toFixed(1)+"h"};
}
function avalia(vento){return vento<15?{p:"BOA",c:"badge-ok",n:"FAVORÁVEL",nc:"badge-ok"}:vento<25?{p:"MÉDIA",c:"badge-atencao",n:"ATENÇÃO",nc:"badge-atencao"}:{p:"RUIM",c:"badge-ruim",n:"DESFAVORÁVEL",nc:"badge-ruim"};}

// NOVA FUNÇÃO - RELATÓRIO 10+10 DIAS
async function gerarRelatorio(){
  if(!praiaAtual) return;
  const box=document.getElementById('relBox');
  document.getElementById('modalRel').style.display='block';
  box.innerHTML=`<h2>📊 Relatório - ${praiaAtual.n}</h2><p>Buscando últimos 10 dias + próximos 10 dias...</p><p><small>${praiaAtual.municipio} - ${praiaAtual.lat.toFixed(3)}, ${praiaAtual.lng.toFixed(3)}</small></p>`;
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${praiaAtual.lat}&longitude=${praiaAtual.lng}&past_days=10&forecast_days=10&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_sum,weather_code&timezone=America/Bahia`;
    const r=await fetch(url); const j=await r.json(); const d=j.daily;
    let html=`<h2>📊 Relatório Completo - ${praiaAtual.n}</h2>
    <p><b>${praiaAtual.municipio}</b> | ${praiaAtual.lat.toFixed(3)}, ${praiaAtual.lng.toFixed(3)} | ${praiaAtual.tipo}</p>
    <button class="btn-rel btn-pdf" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
    <button class="btn-rel btn-csv" onclick="baixarCSV()">📥 Baixar CSV (Excel)</button>
    <button class="btn-rel btn-reset" onclick="document.getElementById('modalRel').style.display='none'">Fechar</button>
    <h3>Últimos 10 dias (Passado)</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Pesca</th></tr>`;
    for(let i=0;i<10;i++){
      const data=d.time[i]; const max=d.temperature_2m_max[i]; const min=d.temperature_2m_min[i]; const vento=d.wind_speed_10m_max[i]; const chuva=d.precipitation_sum[i];
      const pes=vento<15?"BOA":vento<25?"MÉDIA":"RUIM";
      html+=`<tr><td>${data.split('-').reverse().join('/')}</td><td>${max}°C</td><td>${min}°C</td><td>${vento}km/h</td><td>${chuva}mm</td><td>${pes}</td></tr>`;
    }
    html+=`</table><h3>Próximos 10 dias (Previsão)</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Navegação</th></tr>`;
    for(let i=10;i<d.time.length;i++){
      const data=d.time[i]; const max=d.temperature_2m_max[i]; const min=d.temperature_2m_min[i]; const vento=d.wind_speed_10m_max[i]; const chuva=d.precipitation_sum[i];
      const nav=vento<15?"FAVORÁVEL":vento<25?"ATENÇÃO":"DESFAVORÁVEL";
      html+=`<tr style="${i==10?'background:#e8f6ff;font-weight:bold':''}"><td>${data.split('-').reverse().join('/')}${i==10?' (HOJE)':''}</td><td>${max}°C</td><td>${min}°C</td><td>${vento}km/h</td><td>${chuva}mm</td><td>${nav}</td></tr>`;
    }
    html+=`</table><p><small>Fonte: Open-Meteo / INMET - Gerado em ${new Date().toLocaleString('pt-BR')}</small></p>`;
    box.innerHTML=html;
    window._ultimoRelatorio=d;
  }catch(e){ box.innerHTML+=`<p style="color:red">Erro ao buscar dados. Tente novamente com internet.</p>`; }
}
function baixarCSV(){
  if(!window._ultimoRelatorio) return;
  const d=window._ultimoRelatorio;
  let csv="Data,Temp Max,Temp Min,Vento Max,Chuva,Praia\n";
  for(let i=0;i<d.time.length;i++){ csv+=`${d.time[i]},${d.temperature_2m_max[i]},${d.temperature_2m_min[i]},${d.wind_speed_10m_max[i]},${d.precipitation_sum[i]},${praiaAtual.n}\n`; }
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`relatorio-${praiaAtual.n.replace(/ /g,'_')}-${new Date().toISOString().split('T')[0]}.csv`; a.click();
}

async function mostrarInfo(p){
  praiaAtual=p;
  const panel=document.getElementById('infoPanel');
  panel.innerHTML=`<b>⏳ Buscando tempo real de ${p.n}...</b>`;
  const tempo=await buscarTempoReal(p.lat,p.lng); const mare=calculaMare();
  let html=`<b>${p.n}</b> <span style="background:${p.cor};color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">${p.costa}</span><br>
  <b>${p.municipio}</b> | ${p.lat.toFixed(3)}, ${p.lng.toFixed(3)}<br><small>${p.desc}</small>
  <div class="tempo-real">`;
  if(tempo.ok){
    const av=avalia(tempo.vento);
    html+=`<b>🌡️ AO VIVO: ${tempo.temp}°C - ${tempo.cond}</b><br>💨 Vento: ${tempo.vento} km/h<br>🌊 Maré: ${mare.altura}m - ${mare.estado}<br>🐟 Pesca: <span class="badge ${av.c}">BOA - ${av.p}</span> | ⛵ <span class="badge ${av.nc}">${av.n}</span><br><small>${new Date().toLocaleTimeString('pt-BR')}</small>`;
  } else html+=`🌊 Maré: ${mare.altura}m - ${mare.estado}`;
  html+=`</div><button class="btn-rel" onclick="gerarRelatorio()">📊 GERAR RELATÓRIO 10 DIAS PASSADOS + 10 DIAS FUTURO</button>${p.real?'<div style="color:red;font-weight:bold;margin-top:5px">★ PONTO REAL OFICIAL</div>':''}`;
  panel.innerHTML=html;
}
function criarMarcadores(lista){
  grupo.clearLayers();
  lista.forEach(p=>{
    let m=L.circleMarker([p.lat,p.lng],{radius:p.real?14:7,fillColor:p.cor,color:"#fff",weight:p.real?3:1,fillOpacity:0.9}).addTo(grupo);
    m.on('click',()=>mostrarInfo(p));
  });
  document.getElementById('contador').innerText=lista.length;
}
function filtrarCosta(c){let f=praias.filter(p=>p.costa===c);criarMarcadores(f);if(f.length){map.setView([f.reduce((a,b)=>a+b.lat,0)/f.length,f.reduce((a,b)=>a+b.lng,0)/f.length],9);}}
function filtrarBusca(){let t=document.getElementById('busca').value.toLowerCase();criarMarcadores(praias.filter(p=>p.n.toLowerCase().includes(t)||p.municipio.toLowerCase().includes(t)));}
function irItapua(){let it=praias.find(p=>p.real);map.setView([it.lat,it.lng],14);mostrarInfo(it);}
function resetar(){document.getElementById('busca').value="";criarMarcadores(praias);map.setView([-14.5,-39.0],7);}
criarMarcadores(praias);
</script>
</body>
</html>
