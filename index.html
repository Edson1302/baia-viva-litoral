<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAIA VIVA 12.0 - Prof Edson + Prof Jemisson</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial}
#topo{background:#0a3d62;color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:18px}
#mapa{height:78vh;width:100%}
.rodape{background:#ecf0f1;padding:8px;text-align:center;font-size:12px}
.btn{position:absolute;top:80px;left:10px;z-index:999;background:#e74c3c;color:#fff;padding:10px 14px;border:none;border-radius:10px;font-weight:bold}
.defeso{color:#fff;background:#e74c3c;padding:3px 6px;border-radius:5px;font-weight:bold;display:inline-block;margin-top:4px}
</style>
</head>
<body>
<div id="topo">🌊 BAIA VIVA 12.0 - Prof. Edson + Prof. Jemisson | 82 Pontos | Defeso Ativo</div>
<button class="btn" onclick="meuGPS()">📍 MINHA PRAIA</button>
<div id="mapa"></div>
<div class="rodape">📊 INEMA-BA | 🔴 Defeso: Robalo 15/05-31/07 | Curimba 01/11-28/02 | Camarão 01/04-15/05<br>Créditos: Prof. Edson Silva + Prof. Jemisson Santos - IFBA Periperi</div>
<script>
const pontos = [
{name:"Periperi", lat:-12.872, lng:-38.482, tipo:"praia", balne:85, foto:"https://picsum.photos/seed/Periperi/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Praia de Periperi II", lat:-12.874, lng:-38.48, tipo:"praia", balne:82, foto:"https://picsum.photos/seed/Periperi2/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Ribeira", lat:-12.909, lng:-38.506, tipo:"praia", balne:50, foto:"https://picsum.photos/seed/Ribeira/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Bonfim", lat:-12.923, lng:-38.497, tipo:"praia", balne:45, foto:"https://picsum.photos/seed/Bonfim/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Pituba", lat:-13.005, lng:-38.459, tipo:"praia", balne:78, foto:"https://picsum.photos/seed/Pituba/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Stella Maris", lat:-12.94, lng:-38.33, tipo:"praia", balne:90, foto:"https://picsum.photos/seed/Stella/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Flamengo", lat:-12.92, lng:-38.32, tipo:"praia", balne:88, foto:"https://picsum.photos/seed/Flamengo/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Itapuã", lat:-12.957, lng:-38.355, tipo:"praia", balne:82, foto:"https://picsum.photos/seed/Itapua/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Farol da Barra", lat:-13.009, lng:-38.533, tipo:"praia", balne:70, foto:"https://picsum.photos/seed/Barra/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Piatã", lat:-12.98, lng:-38.38, tipo:"praia", balne:85, foto:"https://picsum.photos/seed/Piata/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Arembepe", lat:-12.75, lng:-38.18, tipo:"praia", balne:95, foto:"https://picsum.photos/seed/Arembepe/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Praia do Forte", lat:-12.58, lng:-38.0, tipo:"praia", balne:96, foto:"https://picsum.photos/seed/Forte/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Cacha Pregos - Ilha", lat:-13.13, lng:-38.72, tipo:"praia", balne:95, foto:"https://picsum.photos/seed/Cacha/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Boipeba", lat:-13.6, lng:-38.92, tipo:"praia", balne:98, foto:"https://picsum.photos/seed/Boipeba/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Itaparica - Ponta de Areia", lat:-12.89, lng:-38.67, tipo:"praia", balne:70, foto:"https://picsum.photos/seed/Itaparica/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Ilha de Maré - Praia das Neves", lat:-12.75, lng:-38.52, tipo:"praia", balne:85, foto:"https://picsum.photos/seed/Mare/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Madre de Deus - Cação", lat:-12.74, lng:-38.62, tipo:"praia", balne:60, foto:"https://picsum.photos/seed/Madre/300/150", defeso:"🔴 Defeso Robalo: 15/05 a 31/07 - Não pescar!"},
{name:"Foz Rio das Contas - Itacaré", lat:-14.32, lng:-39.01, tipo:"mangue", balne:95, foto:"https://picsum.photos/seed/Foz/300/150", defeso:""},
{name:"Mangue da Ribeira", lat:-12.908, lng:-38.505, tipo:"mangue", balne:60, foto:"https://picsum.photos/seed/MangueRib/300/150", defeso:""},
{name:"Mangue de Maré", lat:-12.76, lng:-38.53, tipo:"mangue", balne:88, foto:"https://picsum.photos/seed/MangueMare/300/150", defeso:""},
{name:"Mangue de Salinas", lat:-12.87, lng:-38.76, tipo:"mangue", balne:85, foto:"https://picsum.photos/seed/MangueSal/300/150", defeso:""},
];
const mapa = L.map('mapa').setView([-12.9, -38.5], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
function addTudo(lista){
  lista.forEach(p=>{
    let cor = p.balne>=70?'green':p.balne>=50?'orange':'red';
    let icone = L.divIcon({html:`<div style="background:${cor};color:#fff;border-radius:50%;width:14px;height:14px;border:2px solid #fff"></div>`, iconSize:[18,18]});
    let status = p.balne>=70?'PRÓPRIA':'IMPRÓPRIA';
    let def = p.tipo==='praia' ? `<br><span class="defeso">${p.defeso}</span>` : `<br>🌱 Berçário de Mangue - Área de Proteção`;
    let html = `<b>${p.name}</b><br>${p.tipo.toUpperCase()} - ${p.balne}% - <b style="color:${cor}">${status}</b><br><img src="${p.foto}" width="200" style="border-radius:8px;margin-top:4px"><br>${def}<br><small>Lat:${p.lat} Lng:${p.lng}</small>`;
    L.marker([p.lat,p.lng],{icon:icone}).addTo(mapa).bindPopup(html);
  });
}
addTudo(pontos);
function meuGPS(){
  navigator.geolocation.getCurrentPosition(pos=>{
    L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(mapa).bindPopup("📍 Você está aqui!").openPopup();
    mapa.setView([pos.coords.latitude, pos.coords.longitude],13);
  });
}
</script>
</body>
</html>
