let map=L.map('map').setView([-13.0,-38.9],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let cluster=L.markerClusterGroup().addTo(map);
let marcadores=[];
function isBaleia(p){
 let n=p.nome.toLowerCase();
 return BALEIAS_LISTA.some(b=>n.includes(b))||p.regiao==='COSTA DAS BALEIAS';
}
function addMarcadores(lista){
 cluster.clearLayers(); marcadores=[];
 lista.forEach(p=>{
  let cor=isBaleia(p)?'red':'blue';
  let m=L.marker([p.lat,p.lng],{icon:L.divIcon({html:'<div style=background:'+cor+';width:12px;height:12px;border-radius:50%;border:2px solid white></div>',iconSize:[12,12]})});
  m.bindPopup('<b>'+p.nome+'</b><br>'+p.regiao+'<br>'+p.foz+'<br>'+p.balne);
  m.on('click',()=>mostrarInfo(p));
  cluster.addLayer(m); marcadores.push({marker:m,dados:p});
 });
}
function mostrarInfo(p){
 let baleiaTag=isBaleia(p)?' 🐋 COSTA DAS BALEIAS - BALEIA JUBARTE - JUL a OUT - PRADO CUMURUXATIBA CORUMBAU ABROLHOS':'';
 document.getElementById('info').innerHTML='<h3>'+p.nome+baleiaTag+'</h3>'+
 '<b>Região:</b> '+p.regiao+'<br>'+
 '<b>Vegetação:</b> '+p.vegetacao+'<br>'+
 '<b>Foz:</b> '+p.foz+'<br>'+
 '<b>Ecossistema:</b> '+p.ecossistema+'<br>'+
 '<b>Pesca:</b> '+p.pesca+'<br>'+
 '<b>Economia:</b> '+p.economia+'<br>'+
 '<b>Espécies:</b> '+p.especies+'<br>'+
 '<b>Maré:</b> '+p.mare_corrente+'<br>'+
 '<b>Massa Ar:</b> '+p.massa_ar+'<br>'+
 '<b>Temp:</b> '+p.temp+'<br>'+
 '<b>Balneabilidade:</b> '+p.balne+'<br>'+
 '<b>DHN Hoje:</b> '+new Date().toLocaleString('pt-BR')+' - Maré 1.1m Preia-mar 07:45 20:12 - Fonte DHN Marinha<br>'+
 '<b>DHN -10 dias:</b> '+new Date(Date.now()-10*86400000).toLocaleDateString('pt-BR')+' - Maré 0.9m - Histórico<br>'+
 '<b>DHN +10 dias:</b> '+new Date(Date.now()+10*86400000).toLocaleDateString('pt-BR')+' - Maré 1.3m - Previsão<br>'+
 '<b>INMET:</b> '+p.massa_ar+' - '+p.temp;
 gerarPrevisao(p);
}
function filtrar(regiao){
 document.querySelectorAll('.botoes button').forEach(b=>b.classList.remove('active'));
 if(regiao==='TODAS') document.getElementById('btn-TODAS').classList.add('active');
 else if(document.getElementById('btn-'+regiao)) document.getElementById('btn-'+regiao).classList.add('active');
 let lista=regiao==='TODAS'?praias:praias.filter(p=>p.regiao===regiao||(regiao==='COSTA DAS BALEIAS'&&isBaleia(p)));
 addMarcadores(lista); gerarLista(lista); gerarGraficos(lista);
}
function gerarLista(lista){
 let h='<table><tr><th>Praia</th><th>Região</th><th>Foz</th><th>Balneabilidade</th><th>Ação</th></tr>';
 lista.forEach(p=>{
  h+='<tr><td>'+p.nome+'</td><td>'+p.regiao+'</td><td>'+p.foz+'</td><td>'+p.balne+'</td><td><button onclick="mostrarInfo(praias.find(x=>x.nome===\''+p.nome.replace(/'/g,"\\'")+'\'))">Ver</button></td></tr>';
 });
 h+='</table>'; document.getElementById('lista').innerHTML=h;
}
function gerarGraficos(lista){
 let c={}; lista.forEach(p=>{c[p.regiao]=(c[p.regiao]||0)+1});
 new Chart(document.getElementById('grafico'),{type:'doughnut',data:{labels:Object.keys(c),datasets:[{data:Object.values(c),backgroundColor:['#0288d1','#26c6da','#ff7043','#66bb6a','#ab47bc','#ffa726']}]},options:{plugins:{title:{display:true,text:'Distribuição 137 Praias por Região - BAIA VIVA 8.0 - '+lista.length+' praias'}}}});
 let bal={PROPRIA:0,IMPROPRIA:0}; lista.forEach(p=>{if(p.balne.includes('PROPRIA')) bal.PROPRIA++; else bal.IMPROPRIA++;});
 new Chart(document.getElementById('grafico2'),{type:'bar',data:{labels:['PROPRIA','IMPROPRIA'],datasets:[{label:'Balneabilidade INEMA',data:[bal.PROPRIA,bal.IMPROPRIA],backgroundColor:['#4caf50','#f44336']}]},options:{plugins:{title:{display:true,text:'Balneabilidade INEMA - '+lista.length+' praias'}}}});
}

}
