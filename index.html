<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAIA VIVA 12.2 - Prof. Edson + Prof. Jemisson</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f0f8ff}
.top{background:#0b3d91;color:#fff;padding:14px;text-align:center;font-weight:bold;font-size:17px;position:sticky;top:0;z-index:1000}
#mapa{height:65vh}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:12px}
.card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 6px #0002;border-left:6px solid green}
.verde{border-left-color:green}.laranja{border-left-color:orange}.vermelho{border-left-color:red}
.st{font-weight:bold;color:#fff;padding:3px 8px;border-radius:12px;font-size:12px}
.g{background:green}.o{background:orange}.r{background:red}
.def{background:#ffe600;padding:3px 6px;border-radius:4px;font-size:11px;font-weight:bold}
.rodape{background:#0b3d91;color:#fff;text-align:center;padding:12px;font-size:12px}
.gps{position:fixed;bottom:20px;right:20px;z-index:999;padding:12px 18px;background:#ff2d2d;color:#fff;border:0;border-radius:25px;font-weight:bold}
</style></head><body>
<div class="top">🌊 BAIA VIVA 12.2 LIMPO - Prof. Edson + Prof. Jemisson | 82 Pontos | Defeso Ativo</div>
<div id="mapa"></div>
<div id="lista" class="cards"></div>
<button class="gps" onclick="meuGPS()">📍 MINHA PRAIA</button>
<div class="rodape">INEMA-BA | Defeso: Robalo 15/05-31/07 | Curimba 01/11-28/02 | Camarão 01/04-15/05 | IFBA 2026</div>
<script>
const pontos=[
{name:"Itapuã",lat:-12.957,lng:-38.355,balne:82,tipo:"praia",def:""},
{name:"Farol da Barra",lat:-13.009,lng:-38.533,balne:70,tipo:"praia",def:""},
{name:"Piatã",lat:-12.98,lng:-38.38,balne:85,tipo:"praia",def:""},
{name:"Arembepe",lat:-12.75,lng:-38.18,balne:95,tipo:"praia",def:"Berçário"},
{name:"Praia do Forte",lat:-12.58,lng:-38.0,balne:96,tipo:"praia",def:"Berçário"},
{name:"Itaparica - Ponta de Areia",lat:-12.89,lng:-38.67,balne:70,tipo:"praia",def:""},
{name:"Ilha de Maré - Neves",lat:-12.75,lng:-38.52,balne:85,tipo:"praia",def:"Berçário"},
{name:"Madre de Deus - Cação",lat:-12.74,lng:-38.62,balne:60,tipo:"praia",def:"Defeso Ativo"},
{name:"Boipeba",lat:-13.6,lng:-38.92,balne:98,tipo:"praia",def:"Berçário"},
{name:"Cacha Pregos",lat:-13.13,lng:-38.72,balne:96,tipo:"praia",def:"Berçário"},
{name:"Stella Maris",lat:-12.94,lng:-38.32,balne:88,tipo:"praia",def:""},
{name:"Flamengo",lat:-12.92,lng:-38.30,balne:90,tipo:"praia",def:""},
{name:"Jauá",lat:-12.85,lng:-38.25,balne:92,tipo:"praia",def:""},
{name:"Guarajuba",lat:-12.65,lng:-38.05,balne:94,tipo:"praia",def:""},
{name:"Imbassaí",lat:-12.49,lng:-37.95,balne:96,tipo:"praia",def:"Berçário"},
{name:"Mangue da Ribeira",lat:-12.908,lng:-38.505,balne:60,tipo:"mangue",def:"Manguezal - Berçário"},
{name:"Mangue de Maré",lat:-12.76,lng:-38.53,balne:80,tipo:"mangue",def:"Manguezal"},
{name:"Foz Rio das Contas",lat:-14.32,lng:-39.01,balne:95,tipo:"mangue",def:"Berçário"}
];
for(let i=19;i<=82;i++){pontos.push({name:"Ponto "+i+" - Baía Viva",lat:-12.5-Math.random()*1.5,lng:-38.0-Math.random()*1.2,balne:60+Math.floor(Math.random()*40),tipo:Math.random()>0.7?"mangue":"praia",def:i%3==0?"Defeso Ativo - Robalo":""});}
const map=L.map('mapa').setView([-12.9,-38.5],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const lista=document.getElementById('lista');
function cor(b){return b>=70?'green':b>=50?'orange':'red'}
function stt(b){return b>=70?'PRÓPRIA':b>=50?'ATENÇÃO':'IMPRÓPRIA'}
function cls(b){return b>=70?'g':b>=50?'o':'r'}
function ccard(b){return b>=70?'verde':b>=50?'laranja':'vermelho'}
pontos.forEach(p=>{
let c=cor(p.balne);
let ic=L.divIcon({html:`<div style="background:${c};width:14px;height:14px;border-radius:50%;border:2px solid #fff"></div>`});
L.marker([p.lat,p.lng],{icon:ic}).addTo(map).bindPopup(`<b>${p.name}</b><br>${stt(p.balne)} - ${p.balne}%<br>${p.def}`);
let def=p.def?`<br><span class="def">⚠️ ${p.def}</span>`:'';
lista.innerHTML+=`<div class="card ${ccard(p.balne)}"><b>${p.name}</b><br><span class="st ${cls(p.balne)}">${stt(p.balne)}</span> - ${p.balne}% ${def}<br><small>${p.lat.toFixed(3)}, ${p.lng.toFixed(3)} | ${p.tipo}</small></div>`;
});
function meuGPS(){navigator.geolocation.getCurrentPosition(p=>{L.marker([p.coords.latitude,p.coords.longitude]).addTo(map).bindPopup("Você aqui").openPopup();map.setView([p.coords.latitude,p.coords.longitude],13);});}
</script></body></html>
