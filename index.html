let praiaAtual=null, mangueOn=false, vegOn=false, estuarioOn=false, turOn=false, distAtiva=false, pontosDist=[];
function haversine(lat1,lon1,lat2,lon2){const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));return R*c;}
async function buscarTempoReal(lat,lng){try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,weather_code&timezone=America/Bahia`;const r=await fetch(url);const j=await r.json();const c=j.current;let cond=c.weather_code<=1?"Céu limpo ☀️":c.weather_code<=3?"Parcial ⛅":c.weather_code<=67?"Chuva 🌧️":"Instável ⛈️";return {temp:c.temperature_2m,vento:c.wind_speed_10m,cond:cond,ok:true};}catch(e){return {ok:false};}
}
function avalia(v){return v<15?{p:"BOA",c:"badge-ok",n:"FAVORÁVEL",nc:"badge-ok"}:v<25?{p:"MÉDIA",c:"badge-atencao",n:"ATENÇÃO",nc:"badge-atencao"}:{p:"RUIM",c:"badge-ruim",n:"DESFAVORÁVEL",nc:"badge-ruim"};}
async function gerarRelatorio(){if(!praiaAtual) return;const box=document.getElementById('relBox');document.getElementById('modalRel').style.display='block';box.innerHTML=`<h2>📊 Relatório TOTAL - ${praiaAtual.n}</h2><p>Buscando 10 dias passados + 10 futuros...</p>`;try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${praiaAtual.lat}&longitude=${praiaAtual.lng}&past_days=10&forecast_days=10&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_sum&timezone=America/Bahia`;const r=await fetch(url);const j=await r.json();const d=j.daily;let html=`<h2>📊 Relatório TOTAL - ${praiaAtual.n}</h2><p><b>${praiaAtual.municipio}</b> | <span style="font-family:monospace;background:#000;color:#0f0;padding:2px 6px">${praiaAtual.lat.toFixed(6)}, ${praiaAtual.lng.toFixed(6)}</span></p><div style="background:#fff3cd;padding:8px;border-radius:8px"><b>🏖️ Turismo:</b> ${praiaAtual.visitantes} | <b>Alta:</b> ${praiaAtual.alta}<br><b>♻️ Preservação:</b> ${praiaAtual.preserv}<br><b>📍 Pontos:</b> ${praiaAtual.pontos||praiaAtual.desc}</div><button class="btn-rel btn-pdf" onclick="window.print()">🖨️ Imprimir / PDF</button><button class="btn-rel btn-csv" onclick="baixarCSV()">📥 CSV</button><button class="btn-rel btn-reset" onclick="document.getElementById('modalRel').style.display='none'">Fechar</button><h3>Últimos 10 dias</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Pesca</th></tr>`;for(let i=0;i<10;i++){const pes=d.wind_speed_10m_max[i]<15?"BOA":d.wind_speed_10m_max[i]<25?"MÉDIA":"RUIM";html+=`<tr><td>${d.time[i].split('-').reverse().join('/')}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${pes}</td></tr>`;}html+=`</table><h3>Próximos 10 dias</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Nav</th></tr>`;for(let i=10;i<d.time.length;i++){const nav=d.wind_speed_10m_max[i]<15?"FAVORÁVEL":d.wind_speed_10m_max[i]<25?"ATENÇÃO":"DESFAVORÁVEL";html+=`<tr style="${i==10?'background:#e8f6ff;font-weight:bold':''}"><td>${d.time[i].split('-').reverse().join('/')}${i==10?' (HOJE)':''}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${nav}</td></tr>`;}html+=`</table><h3>🌿 Geografia Física</h3><p>Mangue mais próximo: Baía Camamu 120km² - Berçário | Vegetação: Mata/Restinga | Estuário: Rio próximo alimenta</p><h3>📅 Sazonalidade Anual</h3><table><tr><th>Mês</th><th>Turismo</th><th>Preservação</th></tr>`;sazonal.forEach(s=>{html+=`<tr><td>${s.m}</td><td>${s.tur}</td><td>${s.preserv}</td></tr>`;});html+=`</table>`;box.innerHTML=html;window._ultimoRelatorio=d;}catch(e){box.innerHTML+=`<p style="color:red">Erro.</p>`;}}
function baixarCSV(){if(!window._ultimoRelatorio) return;const d=window._ultimoRelatorio;let csv="Data,Temp Max,Temp Min,Vento,Chuva,Praia,Lat,Lng,Visitantes\n";for(let i=0;i<d.time.length;i++){csv+=`${d.time[i]},${d.temperature_2m_max[i]},${d.temperature_2m_min[i]},${d.wind_speed_10m_max[i]},${d.precipitation_sum[i]},${praiaAtual.n},${praiaAtual.lat},${praiaAtual.lng},${praiaAtual.visitantes}\n`;}const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`relatorio-TOTAL-${praiaAtual.n}.csv`;a.click();}
async function mostrarInfo(p){praiaAtual=p;document.getElementById('coordAtiva').innerText=`${p.lat.toFixed(3)},${p.lng.toFixed(3)}`;if(distAtiva){pontosDist.push(p);if(pontosDist.length==1){document.getElementById('distInfo').innerText=`Origem: ${p.n} - clique destino`;document.getElementById('infoPanel').innerHTML=`<b>📏 Distância</b><br>Origem: ${p.n}<br><div class="coord-box">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div><br>Clique em outra praia!`;return;}if(pontosDist.length==2){const d=haversine(pontosDist[0].lat,pontosDist[0].lng,pontosDist[1].lat,pontosDist[1].lng);document.getElementById('distInfo').innerText=`${pontosDist[0].n} → ${pontosDist[1].n}: ${d.toFixed(1)}km`;document.getElementById('infoPanel').innerHTML=`<b>Distância Calculada</b><br>${pontosDist[0].n}<br><div class="coord-box">- ${pontosDist[0].lat.toFixed(6)}, ${pontosDist[0].lng.toFixed(6)}</div><br>${pontosDist[1].n}<br><div class="coord-box">- ${pontosDist[1].lat.toFixed(6)}, ${pontosDist[1].lng.toFixed(6)}</div><div style="background:#000;color:#0f0;padding:8px;border-radius:8px;text-align:center;margin-top:6px"><b style="font-size:18px">${d.toFixed(1)} km</b><br>${(d/80).toFixed(1)}h de carro | ${(d/20).toFixed(1)}h de barco</div><button class="btn-rel" style="background:#3498db" onclick="pontosDist=[];document.getElementById('distInfo').innerText='';document.getElementById('infoPanel').innerHTML='Nova medição - clique em 2 praias';">Nova medição</button>`;pontosDist=[];L.polyline([[p.lat,p.lng],[pontosDist[0]?.lat||p.lat,pontosDist[0]?.lng||p.lng]],{color:'red'}).addTo(grupo);return;}}const panel=document.getElementById('infoPanel');panel.innerHTML=`<b>⏳ ${p.n}...</b>`;const tempo=await buscarTempoReal(p.lat,p.lng);let html=`<b>${p.n}</b> <span style="background:${p.cor};color:#fff;padding:2px 6px;border-radius:10px;font-size:9px">${p.costa}</span><br><b>${p.municipio}</b><br><small>${p.desc} | ${p.tipo} | ${p.ext}</small><div class="coord-box">📍 ${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div><div style="margin-top:6px"><span class="badge badge-tur">👥 ${p.visitantes}</span> <span class="badge badge-ok">📅 ${p.alta}</span></div><div class="sazonal-box"><b>♻️ Preservação:</b> ${p.preserv}<br><small><b>Pontos:</b> ${p.pontos||'-'}</small></div><div class="tempo-real">`;if(tempo.ok){const av=avalia(tempo.vento);html+=`<b>🌡️ ${tempo.temp}°C - ${tempo.cond}</b><br>💨 ${tempo.vento}km/h<br>🐟 <span class="badge ${av.c}">${av.p}</span> | ⛵ <span class="badge ${av.nc}">${av.n}</span>`;}html+=`</div><button class="btn-rel" onclick="gerarRelatorio()">📊 RELATÓRIO TOTAL 10+10 + TURISMO + PRESERVAÇÃO</button>${p.real?'<div style="color:red;font-weight:bold">★ PONTO REAL ITAPUÃ</div>':''}`;panel.innerHTML=html;}
function criarMarcadores(lista){grupo.clearLayers();lista.forEach(p=>{let m=L.circleMarker([p.lat,p.lng],{radius:p.real?14:7,fillColor:p.cor,color:"#fff",weight:p.real?3:1,fillOpacity:0.9}).addTo(grupo);m.on('click',()=>mostrarInfo(p));});document.getElementById('contador').innerText=lista.length;}
function toggleMangue(){if(!mangueOn){manguezais.forEach(m=>{L.circle([m.lat,m.lng],{radius:15000,color:"#1e8449",fillColor:"#27ae60",fillOpacity:0.35,weight:2}).addTo(grupoMangue);});grupoMangue.addTo(map);mangueOn=true;}else{map.removeLayer(grupoMangue);mangueOn=false;}}
function toggleVeg(){if(!vegOn){L.circle([-14.2,-39.0],{radius:20000,color:"#52be80",fillColor:"#82e0aa",fillOpacity:0.25,dashArray:"5,5"}).addTo(grupoVeg);grupoVeg.addTo(map);vegOn=true;}else{map.removeLayer(grupoVeg);vegOn=false;}}
function toggleEstuario(){if(!estuarioOn){L.circleMarker([-12.90,-38.80],{radius:8,fillColor:"#2e86c1",color:"#fff",weight:2}).addTo(grupoEstuario);grupoEstuario.addTo(map);estuarioOn=true;}else{map.removeLayer(grupoEstuario);estuarioOn=false;}}
function toggleTurismo(){if(!turOn){turisticos.forEach(t=>{L.marker([t.lat,t.lng],{icon:L.divIcon({html:"🏖️",className:"",iconSize:[20,20]})}).addTo(grupoTur).bindPopup(`<b>${t.n}</b><br>👥 ${t.vis}`);});grupoTur.addTo(map);turOn=true;}else{map.removeLayer(grupoTur);turOn=false;}}
function ativarDistancia(){distAtiva=!distAtiva;pontosDist=[];if(distAtiva){document.getElementById('distInfo').innerText="MODO DISTÂNCIA: Clique em 2 praias!";alert("📏 MODO DISTÂNCIA ATIVADO!\n\nClique em uma praia de origem, depois em outra de destino. Igual você fez Mangue Seco → Ilhéus 409.6km!");}else{document.getElementById('distInfo').innerText="";}}
function mostrarSazonal(){let html=`<b>📅 Sazonalidade Anual - Litoral BA</b><br><table style="width:100%;font-size:9px;border-collapse:collapse"><tr><th>Mês</th><th>Turismo</th><th>Preservação</th></tr>`;sazonal.forEach(s=>{html+=`<tr><td>${s.m}</td><td>${s.tur}</td><td style="color:red">${s.preserv}</td></tr>`;});html+=`</table><div class="sazonal-box"><b>🔴 Vermelho = Cuidado máximo!</b><br>Jul-Nov: Baleias 100m distância<br>Set-Mar: Tartarugas - luz apagada<br>Abr-Mai: Defeso camarão - não pescar</div>`;document.getElementById('infoPanel').innerHTML=html;}
function filtrarCosta(c){let f=praias.filter(p=>p.costa===c);criarMarcadores(f);if(f.length) map.setView([f.reduce((a,b)=>a+b.lat,0)/f.length,f.reduce((a,b)=>a+b.lng,0)/f.length],9);}
function filtrarBusca(){let t=document.getElementById('busca').value.toLowerCase();if(!t) return criarMarcadores(praias);let fp=praias.filter(p=>p.n.toLowerCase().includes(t)||p.municipio.toLowerCase().includes(t));criarMarcadores(fp);}
function irItapua(){let it=praias.find(p=>p.real);map.setView([it.lat,it.lng],14);mostrarInfo(it);}
function resetar(){map.removeLayer(grupoMangue);map.removeLayer(grupoVeg);map.removeLayer(grupoEstuario);map.removeLayer(grupoTur);mangueOn=vegOn=estuarioOn=turOn=distAtiva=false;pontosDist=[];document.getElementById('busca').value="";document.getElementById('distInfo').innerText="";criarMarcadores(praias);map.setView([-14.5,-39.0],7);}
map.on('mousemove',e=>{document.getElementById('coordAtiva').innerText=`${e.latlng.lat.toFixed(3)},${e.latlng.lng.toFixed(3)}`;});
criarMarcadores(praias);
</script>
</body>
</html>
