async function buscarTempoReal(lat,lng){
  try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,weather_code&timezone=America/Bahia`;const r=await fetch(url);const j=await r.json();const c=j.current;let cond=c.weather_code<=1?"Céu limpo ☀️":c.weather_code<=3?"Parcial ⛅":c.weather_code<=67?"Chuva 🌧️":"Instável ⛈️";return {temp:c.temperature_2m,vento:c.wind_speed_10m,cond:cond,ok:true};}catch(e){return {ok:false};}
}
function calculaMare(){const h=new Date().getHours()+new Date().getMinutes()/60;const altura=(1.2+0.8*Math.sin((h/12.4)*2*Math.PI)).toFixed(1);const fase=h%12.4;let estado=fase<3?"Enchendo ⬆️":fase<6?"Cheia 🌊":fase<9?"Vazando ⬇️":"Baixa 🏜️";return {altura,estado};}
function avalia(v){return v<15?{p:"BOA",c:"badge-ok",n:"FAVORÁVEL",nc:"badge-ok"}:v<25?{p:"MÉDIA",c:"badge-atencao",n:"ATENÇÃO",nc:"badge-atencao"}:{p:"RUIM",c:"badge-ruim",n:"DESFAVORÁVEL",nc:"badge-ruim"};}
async function gerarRelatorio(){if(!praiaAtual) return;const box=document.getElementById('relBox');document.getElementById('modalRel').style.display='block';box.innerHTML=`<h2>📊 Relatório - ${praiaAtual.n}</h2><p>Buscando 10 dias passados + 10 futuros...</p>`;try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${praiaAtual.lat}&longitude=${praiaAtual.lng}&past_days=10&forecast_days=10&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,precipitation_sum&timezone=America/Bahia`;const r=await fetch(url);const j=await r.json();const d=j.daily;let html=`<h2>📊 Relatório - ${praiaAtual.n}</h2><p><b>${praiaAtual.municipio}</b> | ${praiaAtual.lat.toFixed(3)}, ${praiaAtual.lng.toFixed(3)}</p><button class="btn-rel btn-pdf" onclick="window.print()">🖨️ Imprimir / PDF</button><button class="btn-rel btn-csv" onclick="baixarCSV()">📥 CSV</button><button class="btn-rel btn-reset" onclick="document.getElementById('modalRel').style.display='none'">Fechar</button><h3>Últimos 10 dias</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Pesca</th></tr>`;for(let i=0;i<10;i++){const pes=d.wind_speed_10m_max[i]<15?"BOA":d.wind_speed_10m_max[i]<25?"MÉDIA":"RUIM";html+=`<tr><td>${d.time[i].split('-').reverse().join('/')}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${pes}</td></tr>`;}html+=`</table><h3>Próximos 10 dias</h3><table><tr><th>Data</th><th>Máx</th><th>Mín</th><th>Vento</th><th>Chuva</th><th>Nav</th></tr>`;for(let i=10;i<d.time.length;i++){const nav=d.wind_speed_10m_max[i]<15?"FAVORÁVEL":d.wind_speed_10m_max[i]<25?"ATENÇÃO":"DESFAVORÁVEL";html+=`<tr style="${i==10?'background:#e8f6ff;font-weight:bold':''}"><td>${d.time[i].split('-').reverse().join('/')}${i==10?' (HOJE)':''}</td><td>${d.temperature_2m_max[i]}°C</td><td>${d.temperature_2m_min[i]}°C</td><td>${d.wind_speed_10m_max[i]}km/h</td><td>${d.precipitation_sum[i]}mm</td><td>${nav}</td></tr>`;}html+=`</table>`;box.innerHTML=html;window._ultimoRelatorio=d;}catch(e){box.innerHTML+=`<p style="color:red">Erro.</p>`;}}
function baixarCSV(){if(!window._ultimoRelatorio) return;const d=window._ultimoRelatorio;let csv="Data,Temp Max,Temp Min,Vento,Chuva,Praia\n";for(let i=0;i<d.time.length;i++){csv+=`${d.time[i]},${d.temperature_2m_max[i]},${d.temperature_2m_min[i]},${d.wind_speed_10m_max[i]},${d.precipitation_sum[i]},${praiaAtual.n}\n`;}const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`relatorio-${praiaAtual.n}.csv`;a.click();}
async function mostrarInfo(p){praiaAtual=p;const panel=document.getElementById('infoPanel');panel.innerHTML=`<b>⏳ ${p.n}...</b>`;const tempo=await buscarTempoReal(p.lat,p.lng);const mare=calculaMare();let html=`<b>${p.n}</b> <span style="background:${p.cor};color:#fff;padding:2px 6px;border-radius:10px;font-size:9px">${p.costa}</span><br><b>${p.municipio}</b><br><small>${p.desc} | ${p.tipo} | ${p.ext}</small><div class="tempo-real">`;if(tempo.ok){const av=avalia(tempo.vento);html+=`<b>🌡️ ${tempo.temp}°C - ${tempo.cond}</b><br>💨 ${tempo.vento}km/h | 🌊 ${mare.altura}m ${mare.estado}<br>🐟 <span class="badge ${av.c}">${av.p}</span> | ⛵ <span class="badge ${av.nc}">${av.n}</span><br><small>${new Date().toLocaleTimeString('pt-BR')}</small>`;}else html+=`🌊 ${mare.altura}m ${mare.estado}`;html+=`</div><button class="btn-rel" onclick="gerarRelatorio()">📊 RELATÓRIO 10+10 DIAS</button>${p.real?'<div style="color:red;font-weight:bold">★ PONTO REAL</div>':''}`;panel.innerHTML=html;}
function mostrarMangue(m){const p=document.getElementById('infoPanel');p.innerHTML=`<b>🌿 ${m.n}</b><br><b>Área:</b> ${m.area}<br><b>Tipo:</b> ${m.tipo}<br><b>Vegetação:</b> ${m.veg}<br><b>Importância:</b> ${m.imp}<br><div class="tempo-real">Manguezal preservado - berçário natural. Rhizophora (vermelho), Avicennia (preto), Laguncularia (branco).</div>`;}
function mostrarVeg(v){const p=document.getElementById('infoPanel');p.innerHTML=`<b>🌱 ${v.n}</b><br><b>Tipo:</b> ${v.tipo}<br><b>Descrição:</b> ${v.desc}<br><b>Clima:</b> ${v.clima}<br><div class="tempo-real">Vegetação costeira da Bahia - transição Restinga para Mata Atlântica.</div>`;}
function mostrarEstuario(e){const p=document.getElementById('infoPanel');p.innerHTML=`<b>🌊 ${e.n}</b><br><b>Rio:</b> ${e.rio}<br><b>Vazão média:</b> ${e.vazao}<br><b>Bacia:</b> ${e.bacia}<br><b>Importância:</b> ${e.imp}<br><div class="tempo-real">Estuário - encontro rio + mar. Área de manguezal, salinidade variável, berçário.</div>`;}
function criarMarcadores(lista){grupo.clearLayers();lista.forEach(p=>{let m=L.circleMarker([p.lat,p.lng],{radius:p.real?14:7,fillColor:p.cor,color:"#fff",weight:p.real?3:1,fillOpacity:0.9}).addTo(grupo);m.on('click',()=>mostrarInfo(p));});document.getElementById('contador').innerText=lista.length;}
function criarMangues(){grupoMangue.clearLayers();manguezais.forEach(m=>{let pol=L.circle([m.lat,m.lng],{radius:15000,color:"#1e8449",fillColor:"#27ae60",fillOpacity:0.35,weight:2}).addTo(grupoMangue);pol.on('click',()=>mostrarMangue(m));let mark=L.marker([m.lat,m.lng],{icon:L.divIcon({html:"🌿",className:"",iconSize:[20,20]})}).addTo(grupoMangue);mark.on('click',()=>mostrarMangue(m));});}
function criarVeg(){grupoVeg.clearLayers();vegetacao.forEach(v=>{let c=L.circle([v.lat,v.lng],{radius:20000,color:"#52be80",fillColor:"#82e0aa",fillOpacity:0.25,weight:2,dashArray:"5,5"}).addTo(grupoVeg);c.on('click',()=>mostrarVeg(v));let mark=L.marker([v.lat,v.lng],{icon:L.divIcon({html:"🌱",className:"",iconSize:[20,20]})}).addTo(grupoVeg);mark.on('click',()=>mostrarVeg(v));});}
function criarEstuarios(){grupoEstuario.clearLayers();estuarios.forEach(e=>{let m=L.circleMarker([e.lat,e.lng],{radius:8,fillColor:"#2e86c1",color:"#fff",weight:2,fillOpacity:0.9}).addTo(grupoEstuario);m.on('click',()=>mostrarEstuario(e));let mark=L.marker([e.lat,e.lng],{icon:L.divIcon({html:"🌊",className:"",iconSize:[20,20]})}).addTo(grupoEstuario);mark.on('click',()=>mostrarEstuario(e));});}
function toggleMangue(){if(!mangueOn){criarMangues();grupoMangue.addTo(map);mangueOn=true;}else{map.removeLayer(grupoMangue);mangueOn=false;}}
function toggleVeg(){if(!vegOn){criarVeg();grupoVeg.addTo(map);vegOn=true;}else{map.removeLayer(grupoVeg);vegOn=false;}}
function toggleEstuario(){if(!estuarioOn){criarEstuarios();grupoEstuario.addTo(map);estuarioOn=true;}else{map.removeLayer(grupoEstuario);estuarioOn=false;}}
function mostrarTodosGeo(){if(!mangueOn) toggleMangue();if(!vegOn) toggleVeg();if(!estuarioOn) toggleEstuario();}
function filtrarCosta(c){let f=praias.filter(p=>p.costa===c);criarMarcadores(f);if(f.length) map.setView([f.reduce((a,b)=>a+b.lat,0)/f.length,f.reduce((a,b)=>a+b.lng,0)/f.length],9);}
function filtrarBusca(){let t=document.getElementById('busca').value.toLowerCase();if(!t) return criarMarcadores(praias);let fp=praias.filter(p=>p.n.toLowerCase().includes(t)||p.municipio.toLowerCase().includes(t));criarMarcadores(fp);if(t.includes("mangue")) toggleMangue();if(t.includes("rio")||t.includes("estuario")) toggleEstuario();}
function irItapua(){let it=praias.find(p=>p.real);map.setView([it.lat,it.lng],14);mostrarInfo(it);}
function resetar(){map.removeLayer(grupoMangue);map.removeLayer(grupoVeg);map.removeLayer(grupoEstuario);mangueOn=vegOn=estuarioOn=false;document.getElementById('busca').value="";criarMarcadores(praias);map.setView([-14.5,-39.0],7);}
criarMarcadores(praias);
</script>
</body>
</html>
