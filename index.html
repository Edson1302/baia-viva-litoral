<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAÍA VIVA 6.0 - Litoral da Bahia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI, Arial}
header{background:#0b5394;color:white;padding:14px;text-align:center}
header h1{font-size:1.35rem} header p{font-size:.85rem;opacity:.9}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px;background:#eef4fb}
.filters button{border:1px solid #0b5394;background:white;color:#0b5394;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:600}
.filters button.active,.filters button:hover{background:#0b5394;color:white}
#map{height:calc(100vh - 135px);width:100%}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;color:white}
.boa{background:#2ecc71}.impropria{background:#e74c3c}
footer{text-align:center;font-size:.7rem;padding:8px;background:#f8f9fa}
</style>
</head>
<body>
<header>
<h1>🌊 BAÍA VIVA 6.0 - LITORAL DA BAHIA</h1>
<p>Qualidade da água - Dados INEMA | Com H de BAÍA | Prof. Edson Freitas</p>
</header>
<div class="filters">
<button class="active" onclick="filtrar('Todas',this)">Todas</button>
<button onclick="filtrar('Baía',this)">Baía</button>
<button onclick="filtrar('Litoral Norte',this)">Litoral Norte</button>
<button onclick="filtrar('Baixo Sul',this)">Baixo Sul - Itacaré</button>
<button onclick="filtrar('Extremo Sul',this)">Extremo Sul - Porto Seguro</button>
</div>
<div id="map"></div>
<footer>Prof. Edson Freitas - São Fco do Conde | INEMA 2024-25 | Clima Af/As - Mata Atlântica e Restinga | ● BOA ● IMPRÓPRIA</footer>
<script>
const praias=[
{name:"Mangue Seco - Jandaíra",lat:-11.45,lng:-37.35,regiao:"Litoral Norte",cond:"BOA",clima:"As - Tropical quente",veg:"Restinga e coqueirais",bal:"85% própria"},
{name:"Imbassaí",lat:-12.48,lng:-37.96,regiao:"Litoral Norte",cond:"BOA",clima:"Af - Úmido 25°C",veg:"Mata Atlântica e restinga",bal:"92% própria"},
{name:"Praia do Forte",lat:-12.58,lng:-38.01,regiao:"Litoral Norte",cond:"BOA",clima:"Af - 26°C",veg:"Coqueiral e recifes",bal:"89% própria"},
{name:"Periperi - Salvador",lat:-12.87,lng:-38.47,regiao:"Baía",cond:"IMPRÓPRIA",clima:"Af - Baía de Todos os Santos",veg:"Manguezal urbano",bal:"40% - em recuperação"},
{name:"Farol da Barra",lat:-13.01,lng:-38.53,regiao:"Baía",cond:"BOA",clima:"Af - Ventos alísios",veg:"Recifes",bal:"78% própria"},
{name:"Morro de SP - Cairu",lat:-13.37,lng:-38.91,regiao:"Baixo Sul",cond:"BOA",clima:"Af - 26°C úmido",veg:"Mata Atlântica e recifes",bal:"95% própria"},
{name:"Itacaré - Concha",lat:-14.27,lng:-38.99,regiao:"Baixo Sul",cond:"BOA",clima:"Af - Mata úmida",veg:"APA Itacaré-Serra Grande - Mata Atlântica",bal:"96% própria - PARAÍSO DO SURF"},
{name:"Itacaré - Pontal - Rio de Contas",lat:-14.31,lng:-39.01,regiao:"Baixo Sul",cond:"BOA",clima:"Af - Foz",veg:"Manguezal Rio de Contas",bal:"93% própria"},
{name:"Ilhéus - Olivença",lat:-14.92,lng:-39.01,regiao:"Baixo Sul",cond:"IMPRÓPRIA",clima:"Af - 24-26°C",veg:"Mata e cacauais",bal:"58% - atenção"},
{name:"Porto Seguro - Taperapuan",lat:-16.43,lng:-39.07,regiao:"Extremo Sul",cond:"BOA",clima:"Aw - Tropical com seca",veg:"Restinga, Mata e recifes de corais",bal:"88% própria"},
{name:"Porto Seguro - Buranhém",lat:-16.44,lng:-39.06,regiao:"Extremo Sul",cond:"BOA",clima:"Aw - 26°C",veg:"Manguezal Buranhém",bal:"82% própria"},
{name:"Arraial d'Ajuda - Mucugê",lat:-16.48,lng:-39.06,regiao:"Extremo Sul",cond:"BOA",clima:"Aw - Quente úmido",veg:"Falésias e Mata",bal:"91% própria"},
{name:"Trancoso",lat:-16.59,lng:-39.11,regiao:"Extremo Sul",cond:"BOA",clima:"Aw - 25°C",veg:"Falésias coloridas",bal:"94% própria"},
{name:"Caraíva",lat:-16.78,lng:-39.14,regiao:"Extremo Sul",cond:"BOA",clima:"Aw - Preservado",veg:"RESEX Caraíva-Trancoso - Mata Atlântica",bal:"97% - MAIS PRESERVADA"}
];
const map=L.map('map').setView([-14.2,-38.9],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=[];
function addMarkers(lista){
markers.forEach(m=>map.removeLayer(m));markers=[];
lista.forEach(p=>{
const c=p.cond==="BOA"?"#2ecc71":"#e74c3c";
const m=L.circleMarker([p.lat,p.lng],{radius:9,color:c,fillColor:c,fillOpacity:.9,weight:2}).addTo(map);
m.bindPopup(`<b>${p.name}</b><br><b>Região:</b> ${p.regiao}<br><b>Clima:</b> ${p.clima}<br><b>Vegetação:</b> ${p.veg}<br><b>Balneabilidade:</b> ${p.bal}<br><span class="badge ${p.cond==='BOA'?'boa':'impropria'}">${p.cond}</span>`);
markers.push(m);
});
}
function filtrar(r,b){document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(r==='Todas')addMarkers(praias);else addMarkers(praias.filter(p=>p.regiao===r));}
addMarkers(praias);
</script>
</body>
</html>
