const map=L.map('map').setView([-13.0,-38.9],7);

const cluster=L.markerClusterGroup().addTo(map);
let marcadores=[];
let graficoObj=null;

function filtrar(regiao){
document.querySelectorAll('.botoes button').forEach(b=>b.classList.remove('active'));
document.getElementById('btn-'+regiao).classList.add('active');
cluster.clearLayers();
marcadores=[];
let lista= regiao==='TODAS'? praias : praias.filter(p=>p.regiao===regiao);
lista.forEach(p=>{
let m=L.marker([p.lat,p.lng]).bindPopup('<b>'+p.nome+'</b><br>'+p.regiao+'<br>'+p.vegetacao.substring(0,80)+'<br>Foz: '+p.foz.substring(0,80)+'<br>Pesca: '+p.pesca+'<br>INEMA: '+p.balne+'<br>DHN: '+p.mare_corrente);
m.on('click',()=>mostrarInfo(p));
cluster.addLayer(m);
marcadores.push(p);
});
mostrarLista(lista);
desenharGrafico(lista);
mostrarPrevisao(lista[0]);
}

function desenharGrafico(lista){
let ctx=document.getElementById('grafico').getContext('2d');
let cont={};
lista.forEach(p=>{cont[p.regiao]=(cont[p.regiao]||0)+1;});
