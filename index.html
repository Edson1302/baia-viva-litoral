function relogio(){let d=new Date();document.getElementById('relogio').innerText=d.toLocaleTimeString('pt-BR')+' | '+d.toLocaleDateString('pt-BR');} setInterval(relogio,1000);relogio();
let visitas=parseInt(localStorage.getItem('bv_visitas')||'0')+1;localStorage.setItem('bv_visitas',visitas);document.getElementById('totalVisit').innerText=visitas;
function gerarRelatorioEmail(){
let email=document.getElementById('emailInput').value;
if(!email.includes('@')){document.getElementById('emailStatus').innerText='Digite um email válido!';return;}
let filtro=document.getElementById('filtroAtual').innerText;
let praiasFiltro=filtro.includes('TODAS')?praias:praias.filter(p=>filtro.includes(p.cat));
let relatorio=`BAIA VIVA 6.9.5 - RELATORIO\nData: ${new Date().toLocaleString('pt-BR')}\nFiltro: ${filtro}\nTotal Praias: ${praiasFiltro.length}\nVisitas: ${visitas}\n\nLISTA:\n`+praiasFiltro.map(p=>`- ${p.name} (${p.cat}): ${p.info} [${p.lat},${p.lng}]`).join('\n');
let emails=JSON.parse(localStorage.getItem('bv_emails')||'[]');emails.push({email:email,data:new Date().toISOString(),relatorio:relatorio});localStorage.setItem('bv_emails',JSON.stringify(emails));
document.getElementById('emailStatus').innerText='✅ Relatório gerado! Abrindo seu email...';
let mailto=`mailto:${email}?subject=Baia Viva 6.9.5 - Relatorio ${filtro}&body=${encodeURIComponent(relatorio)}`;
window.open(mailto);
}
function baixarTXT(){
let filtro=document.getElementById('filtroAtual').innerText;
let praiasFiltro=filtro.includes('TODAS')?praias:praias.filter(p=>filtro.includes(p.cat));
let txt=`BAIA VIVA 6.9.5\n${new Date().toLocaleString('pt-BR')}\nFiltro: ${filtro}\nTotal: ${praiasFiltro.length}\n\n`+praiasFiltro.map(p=>`${p.name}|${p.cat}|${p.lat}|${p.lng}|${p.info}`).join('\n');
let blob=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`baia_viva_${filtro}_${Date.now()}.txt`;a.click();
document.getElementById('emailStatus').innerText='⬇️ TXT baixado!';
}

let map=L.map('map').setView([-12.97,-38.51],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=[];
function criar(filtro){
markers.forEach(m=>map.removeLayer(m));markers=[];
document.getElementById('lista').innerHTML='';
let filtradas=filtro==='TODAS'?praias:praias.filter(p=>p.cat===filtro);
document.getElementById('filtroAtual').innerText=filtro+' ('+filtradas.length+')';
let txt={'TODAS':'8 PERNAS: 103 PRAIAS - RELATORIO POR EMAIL','SSA_ATL':'Perna 1: Orla Atlântica - 20 praias','RIBEIRA':'Perna 2: Ribeira BTS - 12 praias','SUBURBIO':'Perna 3: Subúrbio - 8 praias','ITAPARICA':'Perna 4: Itaparica/Vera Cruz - 19 praias','BTS_ILHAS':'Perna 5: Ilhas BTS - 8 praias','LITORAL_NORTE':'Perna 6: Litoral Norte - 14 praias','BAIXO_SUL':'Perna 7: Baixo Sul - 12 praias','EXTREMO_SUL':'Perna 8: Extremo Sul - 10 praias'};
document.getElementById('pernasInfo').innerText=txt[filtro]||txt['TODAS'];
filtradas.forEach(p=>{
let oLat=(filtro==='RIBEIRA'||filtro==='ITAPARICA')?(Math.random()-0.5)*0.006:0;
let oLng=(filtro==='RIBEIRA'||filtro==='ITAPARICA')?(Math.random()-0.5)*0.006:0;
let mk=L.marker([p.lat+oLat,p.lng+oLng]).addTo(map).bindPopup(`<b>${p.name}</b><br><small>${p.perna}</small><br>${p.info}<br>🌡️ 27°C | 🌊 Mar<br><small>ID: ${p.praia_id} | ${p.lat.toFixed(3)},${p.lng.toFixed(3)}</small>`);
markers.push(mk);
let d=document.createElement('div');d.className='praia-item';d.innerHTML=`<b>${p.name}</b><br><small>${p.perna} - ${p.info}</small>`;d.onclick=()=>{map.setView([p.lat+oLat,p.lng+oLng],14);mk.openPopup();};document.getElementById('lista').appendChild(d);
});
document.getElementById('totalPraias').innerText=filtradas.length;
if(markers.length){map.fitBounds(new L.featureGroup(markers).getBounds().pad(0.2));}
atualizarGrafico(filtradas);
}
function filtrar(cat,btn){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');criar(cat);}
let chart;
function atualizarGrafico(dados){let ctx=document.getElementById('grafico').getContext('2d');let c={};dados.forEach(p=>{c[p.cat]=(c[p.cat]||0)+1;});if(chart)chart.destroy();chart=new Chart(ctx,{type:'doughnut',data:{labels:Object.keys(c),datasets:[{data:Object.values(c),backgroundColor:['#ffcc00','#1e90ff','#00ff88','#ff6b6b','#9b59b6','#3498db','#e67e22','#2ecc71']}]},options:{plugins:{legend:{labels:{color:'#fff',font:{size:9}}}},responsive:true}});}
criar('TODAS');
</script>
