.main{flex:1;display:flex;overflow:hidden}
.lista{width:380px;overflow-y:auto;background:#f9f9f9;padding:8px;border-right:1px solid #ddd}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;justify-content:center;align-items:center;padding:10px}
.modal.ativo{display:flex}
.box{background:#fff;padding:16px;border-radius:12px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
.box h2{color:#0a3d62;font-size:16px;margin-bottom:4px}
.box input,.box select{width:100%;padding:9px;margin:5px 0;border:1px solid #ddd;border-radius:8px;font-size:13px}
.box button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-salvar{background:#0a3d62;color:#fff}.btn-cancel{background:#e9ecef}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat div{background:#f0f2f5;padding:10px;border-radius:8px;text-align:center}
.stat b{font-size:18px;color:#0a3d62;display:block}
.dado-geo{background:#eaf6ff;padding:6px 8px;border-radius:6px;margin:4px 0;font-size:12px;border-left:3px solid #0a3d62}
@media(max-width:768px){.main{flex-direction:column}.lista{width:100%;height:35vh}#map{height:65vh}}

let map=L.map('map').setView([-13,-38.8],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
let markers=[],chart1,chart2;
function relogio(){document.getElementById('relogio').textContent=new Date().toLocaleTimeString('pt-BR');let t=JSON.parse(localStorage.getItem('visitantes_bv')||'[]').length;document.getElementById('visitantes').textContent=t+' visitantes';}
setInterval(relogio,1000);relogio();

function abrirDetalhe(p){
document.getElementById('boxDetalhe').innerHTML=`
<h2>📍 ${p.nome}</h2><small style="color:${p.status=='PROPRIA'?'#2ecc71':p.status=='ATENCAO'?'#f1c40f':'#e74c3c'};font-weight:bold">● ${p.status} - ${p.regiao}</small>
<div class="dado-geo"><b>🌊 Maritimidade:</b> ${p.maritimidade}</div>
<div class="dado-geo"><b>🌿 Vegetação:</b> ${p.vegetacao}</div>
<div class="dado-geo"><b>🌡️ Temperatura média:</b> ${p.temp} | Água: 26-28°C</div>
<div class="dado-geo"><b>🏖️ Tipo de Costa:</b> ${p.costa}</div>
<div class="dado-geo"><b>👥 Uso predominante:</b> ${p.uso}</div>
<div class="dado-geo" style="background:#fff3cd"><b>📌 Região:</b> ${p.obs} | Lat: ${p.lat} Lng: ${p.lng}</div>
<button class="btn-salvar" onclick="document.getElementById('modalDetalhe').classList.remove('ativo'); abrirCheckinEspecifico('${p.nome}')">✅ FAZER CHECK-IN AQUI</button>
<button class="btn-cancel" onclick="document.getElementById('modalDetalhe').classList.remove('ativo')">Fechar</button>
`;
document.getElementById('modalDetalhe').classList.add('ativo');
}

function render(dados){
const l=document.getElementById('lista');l.innerHTML='';markers.forEach(m=>map.removeLayer(m));markers=[];
dados.forEach(p=>{
const d=document.createElement('div');d.className='card '+p.status;
d.innerHTML=`<b>${p.nome}</b><br><small>${p.regiao} • ${p.maritimidade.split(' - ')[0]} • ${p.status}</small>`;
d.onclick=()=>abrirDetalhe(p);
l.appendChild(d);
const cor=p.status=='PROPRIA'?'#2ecc71':p.status=='ATENCAO'?'#f1c40f':'#e74c3c';
const mk=L.circleMarker([p.lat,p.lng],{radius:7,color:cor,fillColor:cor,fillOpacity:.9}).addTo(map).bindPopup(`<b>${p.nome}</b><br>${p.status}<br><small>Clique na lista pra ver dados geo</small>`);
mk.on('click',()=>abrirDetalhe(p));
markers.push(mk);
});
}
function filtrar(r){document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('ativo'));document.getElementById('b-'+r).classList.add('ativo');if(r=='TODAS')render(praias);else render(praias.filter(p=>p.regiao==r));}
function abrirCheckin(){document.getElementById('praiaVisitada').innerHTML=praias.map(p=>`<option>${p.nome}</option>`).join('');document.getElementById('modalCheck').classList.add('ativo');}
function abrirCheckinEspecifico(nome){abrirCheckin();document.getElementById('praiaVisitada').value=nome;}
function fecharCheckin(){document.getElementById('modalCheck').classList.remove('ativo');}
function salvarVisitante(){const n=document.getElementById('nome').value;const c=document.getElementById('contato').value;const pr=document.getElementById('praiaVisitada').value;const mo=document.getElementById('motivo').value;if(!n){alert('Digite seu nome');return;}let ls=JSON.parse(localStorage.getItem('visitantes_bv')||'[]');ls.push({nome:n,contato:c,praia:pr,motivo:mo,data:new Date().toLocaleString('pt-BR'),dia:new Date().toISOString().slice(0,10)});localStorage.setItem('visitantes_bv',JSON.stringify(ls));alert('🌊 Bem-vindo, '+n+'! Check-in em '+pr+' salvo!');fecharCheckin();relogio();document.getElementById('nome').value='';document.getElementById('contato').value='';}
function abrirPainel(){
let ls=JSON.parse(localStorage.getItem('visitantes_bv')||'[]');
document.getElementById('dataPainel').textContent=new Date().toLocaleString('pt-BR');
document.getElementById('tTotal').textContent=ls.length;
document.getElementById('tHoje').textContent=ls.filter(v=>v.dia==new Date().toISOString().slice(0,10)).length;
let porMotivo={},porPraia={};ls.forEach(v=>{porMotivo[v.motivo]=(porMotivo[v.motivo]||0)+1;porPraia[v.praia]=(porPraia[v.praia]||0)+1;});
let ctx1=document.getElementById('grafMotivo');if(chart1)chart1.destroy();
chart1=new Chart(ctx1,{type:'doughnut',data:{labels:Object.keys(porMotivo),datasets:[{data:Object.values(porMotivo),backgroundColor:['#2ecc71','#0a3d62','#f39c12','#e74c3c','#9b59b6']}]},options:{plugins:{title:{display:true,text:'Visitantes por Motivo'}},responsive:true}});
let ctx2=document.getElementById('grafPraia');if(chart2)chart2.destroy();
let topPraias=Object.entries(porPraia).sort((a,b)=>b[1]-a[1]).slice(0,5);
chart2=new Chart(ctx2,{type:'bar',data:{labels:topPraias.map(p=>p[0]),datasets:[{label:'Check-ins',data:topPraias.map(p=>p[1]),backgroundColor:'#0a3d62'}]},options:{plugins:{title:{display:true,text:'Top 5 Praias'}},responsive:true}});
let hist=ls.slice(-10).reverse().map(v=>`<div style="border-bottom:1px solid #eee;padding:6px 0;font-size:12px"><b>${v.nome}</b> - ${v.praia}<br><small>${v.motivo} • ${v.data}</small></div>`).join('')||'<small>Nenhum visitante ainda.</small>';
document.getElementById('historico').innerHTML=hist;
document.getElementById('modalPainel').classList.add('ativo');
}
function fecharPainel(){document.getElementById('modalPainel').classList.remove('ativo');}
function exportar(){let ls=JSON.parse(localStorage.getItem('visitantes_bv')||'[]');if(ls.length==0){alert('Sem dados ainda');return;}let csv='Nome,Contato,Praia,Motivo,Data,Dia\n'+ls.map(v=>`"${v.nome}","${v.contato}","${v.praia}","${v.motivo}","${v.data}","${v.dia}"`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='visitantes_baia_viva_TCC_Gestao.csv';a.click();}
render(praias);
</script>
</body>
</html>
