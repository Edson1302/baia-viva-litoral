let map=L.map('map').setView([-13.5,-38.9],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
let layerGroup=L.layerGroup().addTo(map);
function filtrar(reg){
 let lista;
 if(reg==='TODAS') lista=praias;
 else if(reg==='COSTA DAS BALEIAS') lista=praias.filter(p=>p.regiao==='COSTA DAS BALEIAS');
 else lista=praias.filter(p=>p.regiao===reg);
 mostrarMapa(lista);
 document.getElementById('info').innerHTML='<b>'+reg+' - '+lista.length+' praias - 2333 LINHAS CORRIGIDO - FUNCIONANDO</b>';
}
function mostrarMapa(lista){
 layerGroup.clearLayers();
 lista.forEach(p=>{
  let cor=p.regiao==='COSTA DAS BALEIAS'?'red':'blue';
  let m=L.circleMarker([p.lat,p.lng],{radius:7,color:cor,fillColor:cor,fillOpacity:0.9}).addTo(layerGroup);
  m.bindPopup('<b>'+p.nome+'</b><br>Regiao: '+p.regiao+'<br>Foz: '+p.foz+'<br>INEMA: '+p.balne+'<br>Esp: '+p.especies+'<br><br>DHN Hoje: 08/09/2026 1.1m Preia-mar 07:45 20:12<br>DHN -10d: 29/08/2026 0.9m Historico<br>DHN +10d: 18/09/2026 1.3m Previsao');
 });
 if(lista.length>0){
  try{let b=L.latLngBounds(lista.map(p=>[p.lat,p.lng])); map.fitBounds(b,{padding:[20,20]});}catch(e){}
 }
}
function gerarRelatorio(){
 let lista=praias.filter(p=>p.regiao==='COSTA DAS BALEIAS');
 let hoje='08/09/2026'; let menos10='29/08/2026'; let mais10='18/09/2026';
 let html='<h2>🐋 RELATORIO COSTA DAS BALEIAS / EXTREMO SUL - HISTORICO -10 DIAS E PREVISAO +10 DIAS - PARA EMAIL - '+hoje+'</h2>';
 html+='<p><b>Total: '+lista.length+' praias extremo sul | Periodo: '+menos10+' ate '+mais10+'</b> | Temporada Baleia Jubarte: Julho a Outubro</p>';
 html+='<table><tr><th>Praia</th><th>Foz</th><th>DHN Hoje</th><th>DHN -10d</th><th>DHN +10d</th><th>INMET</th><th>INEMA</th><th>Especies Baleia</th></tr>';
 lista.forEach(p=>{
  html+='<tr><td>'+p.nome+'</td><td>'+p.foz+'</td><td>1.1m '+hoje+'<br>Preia 07:45 20:12</td><td>0.9m '+menos10+'<br>Historico</td><td>1.3m '+mais10+'<br>Previsao</td><td>mEc 27C</td><td>'+p.balne+'</td><td>'+p.especies+'</td></tr>';
 });
 html+='</table><br><button style="background:#d32f2f;color:#fff;padding:12px;border:none;border-radius:6px;font-weight:bold;cursor:pointer" onclick="enviarEmail()">📧 ENVIAR POR EMAIL - '+lista.length+' PRAIAS</button>';
 document.getElementById('relatorio').innerHTML=html;
 document.getElementById('relatorio').scrollIntoView({behavior:'smooth'});
}
function enviarEmail(){
 let lista=praias.filter(p=>p.regiao==='COSTA DAS BALEIAS');
 let assunto='BAIA VIVA 8.0 - RELATORIO COSTA DAS BALEIAS '+lista.length+' PRAIAS - 08/09/2026';
 let corpo='BAIA VIVA 8.0 - 137 PRAIAS - RELATORIO COSTA DAS BALEIAS%0D%0A';
 corpo+='Total: '+lista.length+' praias | 29/08/2026 ate 18/09/2026%0D%0A%0D%0A';
 lista.forEach(p=>{corpo+=p.nome+' | Foz:'+p.foz+' | DHN Hoje:1.1m 08/09/2026 | DHN -10d:0.9m 29/08/2026 | DHN +10d:1.3m 18/09/2026 | INEMA:'+p.balne+' | Esp:'+p.especies+'%0D%0A%0D%0A';});
 corpo+='Fonte: DHN Marinha + INMET + INEMA + BAIA VIVA 8.0%0D%0Ahttps://edson1302.github.io/baia-viva-litoral/';
 window.open('mailto:?subject='+encodeURIComponent(assunto)+'&body='+corpo,'_blank');
}
