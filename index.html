let markers=[];let chartPraia;let listaAberta=false;
function getLocalSafe(){try{let d=localStorage.getItem('visitantes_bv');return d?JSON.parse(d):[]}catch(e){return[]}}
function relogio(){document.getElementById('relogio').textContent=new Date().toLocaleTimeString('pt-BR');document.getElementById('visitantes').textContent=getLocalSafe().length+' visitantes';document.getElementById('btnLista').textContent=(listaAberta?'✕ FECHAR':'☰ VER 103') }

function toggleLista(){let l=document.getElementById('lista');listaAberta=!listaAberta;l.classList.toggle('aberta',listaAberta);relogio()}
function abrirDetalhe(p){document.getElementById('boxDetalhe').innerHTML=`<h2>📍 ${p.nome}</h2><small style="color:${p.status=='PROPRIA'?'#2ecc71':p.status=='ATENCAO'?'#f1c40f':'#e74c3c'}">● ${p.status} - ${p.regiao}</small><div class="dado-geo"><b>🌊</b> ${p.maritimidade}</div><div class="dado-geo"><b>🌿</b> ${p.vegetacao}</div><div class="dado-geo"><b>🌡️</b> ${p.temp}</div><div class="dado-geo"><b>🏖️</b> ${p.costa}</div><div class="dado-geo"><b>👥</b> ${p.uso}</div><div class="dado-geo" style="background:#fff3cd"><b>📌</b> ${p.lat}, ${p.lng} - SEM EMBOLAÇÃO 6.9.5</div><button class="btn-salvar" onclick="document.getElementById('modalDetalhe').classList.remove('ativo');abrirCheckinEspecifico('${p.nome}')">📲 CHECK-IN</button><button class="btn-cancel" onclick="document.getElementById('modalDetalhe').classList.remove('ativo')">Fechar</button>`;document.getElementById('modalDetalhe').classList.add('ativo');if(window.innerWidth<=768&&listaAberta)toggleLista()}
function render(dados){let l=document.getElementById('lista');l.innerHTML='';markers.forEach(m=>map.removeLayer(m));markers=[];dados.forEach(p=>{let d=document.createElement('div');d.className='card '+p.status;d.innerHTML=`<b>${p.nome}</b><br><small>${p.regiao} • ${p.maritimidade} • ${p.status}</small>`;d.onclick=()=>abrirDetalhe(p);l.appendChild(d);let cor=p.status=='PROPRIA'?'#2ecc71':p.status=='ATENCAO'?'#f1c40f':'#e74c3c';let mk=L.circleMarker([p.lat,p.lng],{radius:6,color:cor,fillColor:cor,fillOpacity:.9}).addTo(map).bindPopup(`<b>${p.nome}</b><br>${p.regiao}`);mk.on('click',()=>abrirDetalhe(p));markers.push(mk)});if(dados.length>0){let g=new L.featureGroup(markers);map.fitBounds(g.getBounds().pad(0.25))}}
function filtrar(r){document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('ativo'));document.getElementById('b-'+r).classList.add('ativo');if(r=='TODAS'){render(praias);map.setView([-13.2,-38.6],8)}else{render(praias.filter(p=>p.regiao==r))}}
function abrirCheckin(){document.getElementById('praiaVisitada').innerHTML=praias.map(p=>`<option>${p.nome} - ${p.regiao}</option>`).join('');document.getElementById('modalCheck').classList.add('ativo')}
function abrirCheckinEspecifico(nome){abrirCheckin();let sel=document.getElementById('praiaVisitada');for(let i=0;i<sel.options.length;i++){if(sel.options[i].text.startsWith(nome)){sel.selectedIndex=i;break;}}}
function fecharCheckin(){document.getElementById('modalCheck').classList.remove('ativo')}
function salvarVisitante(){let n=document.getElementById('nome').value.trim();let c=document.getElementById('contato').value.trim();let pr=document.getElementById('praiaVisitada').value;let mo=document.getElementById('motivo').value;if(!n){alert('Digite nome');return}let ls=getLocalSafe();ls.push({nome:n,contato:c,praia:pr,motivo:mo,data:new Date().toLocaleString('pt-BR'),dia:new Date().toISOString().slice(0,10),timestamp:Date.now()});localStorage.setItem('visitantes_bv',JSON.stringify(ls));let seuNumero="5571992418354";let mensagem=`🌊 *CHECK-IN 6.9.5 103 PRAIAS*%0A👤 ${encodeURIComponent(n)}%0A📱 ${encodeURIComponent(c)}%0A📍 ${encodeURIComponent(pr)}%0A🎯 ${encodeURIComponent(mo)}`;window.open(`https://wa.me/${seuNumero}?text=${mensagem}`,'_blank');alert('✅ Salvo! Zap abrindo...');fecharCheckin();relogio()}
function abrirPainel(){let ls=getLocalSafe();document.getElementById('dataPainel').textContent=new Date().toLocaleString('pt-BR')+' | 103 Praias | Prof Edson';document.getElementById('tTotal').textContent=ls.length;document.getElementById('tHoje').textContent=ls.filter(v=>v.dia==new Date().toISOString().slice(0,10)).length;let porPraia={};ls.forEach(v=>{porPraia[v.praia]=(porPraia[v.praia]||0)+1});let top=Object.entries(porPraia).sort((a,b)=>b[1]-a[1]).slice(0,5);let ctx=document.getElementById('grafPraia');if(chartPraia)chartPraia.destroy();chartPraia=new Chart(ctx,{type:'bar',data:{labels:top.length?top.map(p=>p[0]):['Sem dados'],datasets:[{label:'Check-ins',data:top.length?top.map(p=>p[1]):[0],backgroundColor:'#0a3d62'}]},options:{plugins:{title:{display:true,text:'Top 5 - 103 Praias'}},responsive:true}});let hist=ls.slice(-10).reverse().map(v=>`<div style="border-bottom:1px solid #eee;padding:6px 0;font-size:11px"><b>${v.nome}</b> - ${v.praia}<br><small>${v.motivo} • ${v.data}</small></div>`).join('')||'<small>Nenhum</small>';document.getElementById('historico').innerHTML='<b>Historico</b>'+hist;document.getElementById('modalPainel').classList.add('ativo')}
function fecharPainel(){document.getElementById('modalPainel').classList.remove('ativo')}
function exportar(){let ls=getLocalSafe();if(!ls.length){alert('Sem dados');return}let csv='Nome,Contato,Praia,Motivo,Data\n'+ls.map(v=>`"${v.nome}","${v.contato}","${v.praia}","${v.motivo}","${v.data}"`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='baia_viva_6.9.5_103_PRAIAS_TCC_Edson.csv';a.click()}
