L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
let markers=[];
function atualizarRelogio(){
const agora=new Date();
document.getElementById('relogio').textContent=agora.toLocaleTimeString('pt-BR');
document.getElementById('data').textContent=agora.toLocaleDateString('pt-BR');
}
setInterval(atualizarRelogio,1000);atualizarRelogio();
function render(dados){
const lista=document.getElementById('lista');
lista.innerHTML='';
markers.forEach(m=>map.removeLayer(m));markers=[];
document.getElementById('update').textContent=dados.length+' pontos | AO VIVO';
dados.forEach(p=>{
const div=document.createElement('div');
div.className='card '+p.status;
div.innerHTML='<b>'+p.nome+'</b><small>'+p.regiao+' • '+p.obs+' • '+p.status+'</small>';
div.onclick=()=>map.setView([p.lat,p.lng],13);
lista.appendChild(div);
const cor=p.status=='PROPRIA'?'#2ecc71':p.status=='ATENCAO'?'#f1c40f':'#e74c3c';
const m=L.circleMarker([p.lat,p.lng],{radius:7,color:cor,fillColor:cor,fillOpacity:.9}).addTo(map).bindPopup('<b>'+p.nome+'</b><br>'+p.regiao+'<br>'+p.status);
markers.push(m);
});
}
function filtrar(reg){
document.querySelectorAll('.filtros button').forEach(b=>b.classList.remove('ativo'));
document.getElementById('b-'+reg).classList.add('ativo');
if(reg=='TODAS')render(praias);
else render(praias.filter(p=>p.regiao==reg));
}
render(praias);
