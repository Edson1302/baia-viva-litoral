#clock{font-family:monospace;font-size:16px;color:#7ff0ff}#tempSalvador{background:#0b3a5c;padding:5px 12px;border-radius:20px;font-weight:700;font-size:13px}
main{display:flex;flex:1;overflow:hidden}
#sidebar{width:260px;background:#0a2e4e;padding:12px;overflow-y:auto}

#map{flex:1;min-height:400px}
#infoPanel{background:#082a44;padding:12px;border-top:2px solid #0b5cff;max-height:38vh;overflow-y:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#0d3a61;padding:8px;border-radius:8px;font-size:12px}
.badge{background:#0b5cff;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px}

const map=L.map('map').setView([-13.0,-38.9],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
function relogio(){document.getElementById('clock').innerText=new Date().toLocaleTimeString('pt-BR');}
setInterval(relogio,1000);relogio();
async function fetchTempo(lat,lng){
 try{
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,wind_speed_10m,relative_humidity_2m&timezone=America%2FSao_Paulo`;
  const r=await fetch(url); const j=await r.json(); return j.current;
 }catch(e){return null}
}
async function atualizaSalvador(){
 const cur=await fetchTempo(-13.01,-38.532);
 if(cur){document.getElementById('tempSalvador').innerHTML=`Salvador ${cur.temperature_2m}°C AO VIVO | ${new Date().toLocaleTimeString('pt-BR')}`;}
}
atualizaSalvador(); setInterval(atualizaSalvador,3600000);
pontos.forEach(p=>{
 const m=L.marker([p.lat,p.lng]).addTo(map);
 m.on('click', async()=>{
  const panel=document.getElementById('infoPanel');
  panel.innerHTML='⏳ Buscando AO VIVO...';
  const cur=await fetchTempo(p.lat,p.lng);
  const tAr=cur?`${cur.temperature_2m}°C`:'---';
  const vento=cur?`${cur.wind_speed_10m} km/h`:'---';
  const umid=cur?`${cur.relative_humidity_2m}%`:'---';
  panel.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${p.n}</b><span class=badge>${p.reg}</span></div>
  <div class=grid style="margin-top:8px">
  <div class=card><b>🌡️ Temp Ar AO VIVO</b><br><span style="font-size:18px">${tAr}</span><br><small>${new Date().toLocaleTimeString('pt-BR')}</small></div>
  <div class=card><b>🌊 Temp Agua</b><br>${p.agua}°C</div>
  <div class=card><b>💨 Vento AO VIVO</b><br>${vento}<br>Umidade ${umid}</div>
  <div class=card><b>🧂 Salinidade</b><br>${p.sal} PSU<br>${p.corr}</div>
  <div class=card><b>🌳 Vegetacao</b><br>${p.veg}% Mata Atlantica</div>
  <div class=card><b>🌱 Mangue</b><br>${p.mangue}% cobertura</div>
  </div>`;
 });
});
